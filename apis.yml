description: DoorDash is an on-demand local commerce platform whose developer program
  exposes its logistics and marketplace network through public APIs. The Drive and
  Drive Classic APIs let businesses request on-demand deliveries fulfilled by DoorDash's
  Dasher fleet, while the Marketplace, Item Management, and Reporting APIs let merchants
  and retailers receive orders, synchronize menus and catalogs, and access financial
  and operational reporting. All APIs use JWT-based authentication and are documented
  at developer.doordash.com.
