description: DoorDash is an on-demand local commerce platform whose developer program
  exposes its logistics and marketplace network through thirteen publicly documented
  REST APIs. Drive, Drive (classic) and Parcel let businesses request deliveries fulfilled
  by DoorDash's Dasher fleet, with Refunds, Redelivery and Dasher Feedback attached to
  that surface. Marketplace, Marketplace (legacy) and Item Management let merchants and
  retailers receive orders and synchronize menus, catalogs, inventory and promotions,
  while Storefront powers white-label online ordering, Reporting delivers financial and
  operational data exchange, and the Ads API sells sponsored placement on the marketplace.
  Every API authenticates with a short-lived HS256 JSON Web Token the caller signs itself,
  and DoorDash serves each OpenAPI definition as plain YAML from developer.doordash.com.

