description: >-
  DoorDash publishes a separate dated release-notes page per API product rather than one platform
  changelog. Four are public: Drive, Drive (classic), Marketplace and Reporting. Only the Reporting
  page is still being updated (last updated May 21, 2026); the Drive page stops at January 2023 and
  Drive (classic) at February 2022, which is the clearest published signal of where DoorDash is
  still investing in its API surface.
