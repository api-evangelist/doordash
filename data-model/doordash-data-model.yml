description: >-
  The DoorDash resource graph as it appears across the thirteen published contracts. The defining
  property is that almost every entity is keyed on a CALLER-SUPPLIED external identifier rather
  than a DoorDash-issued one - external_business_id, external_store_id, external_delivery_id,
  merchant_supplied_id, store_location_id. The partner names the objects; DoorDash stores them
  under those names. That makes the graph easy to join against a partner's own system of record
  and makes identifier collisions the platform's characteristic failure mode (a reused
  external_delivery_id is the documented 409).
