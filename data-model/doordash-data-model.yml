observations:
- 526 component schemas across thirteen documents, with substantial duplication between Drive and Parcel and between Marketplace and Marketplace (legacy).
- >-
  There is no single canonical Store type. A partner integrating Drive AND Marketplace AND Item
  Management maintains three identifiers for the same location and reconciles them itself.
- >-
  Address is modelled per country rather than generically, so adding a market means adding schemas
  rather than a value.
