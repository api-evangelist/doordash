provider: doordash
description: >-
  DoorDash versions each API in its URL path (drive/v1, drive/v2, marketplace/api/v1,
  marketplace/api/v2, dataexchange/v1) and tracks changes on per-product release-notes pages. There
  is a real, public status page. What DoorDash does NOT publish is a deprecation policy: no Sunset
  or Deprecation response headers are documented, no retirement dates are given for Drive (classic)
  or the legacy Marketplace API, and no OpenAPI operation in the harvested specs carries
  deprecated: true.
versioning:
  strategy: url-path
  pattern: https://openapi.doordash.com/{product}/{version}
  versions:
  - product: Drive
    version: v2
    base: https://openapi.doordash.com/drive/v2
    status: current
  - product: Drive (classic)
    version: v1
    base: https://openapi.doordash.com/drive/v1
    status: superseded-but-supported
    note: >-
      Referred to throughout the docs as "Drive (classic)" with its own parallel reference tree.
      No end-of-life date is published.
  - product: Marketplace
    version: v1
    base: https://openapi.doordash.com/marketplace/api/v1
    status: current
  - product: Item Management
    version: v2
    base: https://openapi.doordash.com/marketplace/api/v2
    status: current
  - product: Reporting (dataexchange)
    version: v1
    base: https://openapi.doordash.com/dataexchange/v1
    status: current
  report_versioning: >-
    The Reporting API additionally versions individual report shapes (report_version 2/3/4/5), and
    the release notes state that legacy report versions stay supported but receive no new fields.
deprecation:
  policy_published: false
  policy_url: null
  sunset_header: false
  deprecation_header: false
  deprecated_operations: []
  note: >-
    No deprecation or sunset policy is published on developer.doordash.com, and no RFC 8594 Sunset
    or Deprecation header is documented anywhere in the reference. The Marketplace docs carry a
    "legacy partner migration" FAQ and a marketplace_legacy API reference, which implies a
    migration path exists, but no dated retirement is stated. Zero of the 42 operations in the
    harvested OpenAPI definitions are marked deprecated.
