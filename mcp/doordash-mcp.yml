notes:
- >-
  Every candidate tool inherits its input schema from the named OpenAPI operation in
  openapi/_original/ - nothing here invents a parameter.
- >-
  A real implementation must mint a fresh HS256 JWT per call window (max 1800s) rather than hold a
  static key, and must treat external_delivery_id as the replay key on the three creation tools.
