    get:
      summary: Get creatives
      description: Get creatives with pagination support
      tags:
        - Creatives (SB)
      parameters:
        - name: campaignIdFilter
          in: query
          required: true
          schema:
            type: string
          description: A comma-delimited list of campaign identifiers
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Number of results to return per page
        - $ref: '#/components/parameters/searchAfter'
      responses:
        '200':
          description: Creatives retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  searchAfter:
                    type: string
                    description: >
                      Null when results included all matching resources. Base64
                      encoded string of the request payload when there are
                      additional resources not included within the current
                      result set.
                  results:
                    type: array
                    items:
                      type: object
                      required:
                        - campaignId
                        - adGroupId
                        - creatives
                      properties:
                        campaignId:
                          type: string
                          description: Campaign identifier
                        adGroupId:
                          type: string
                          description: Ad group identifier
                        creatives:
                          type: array
                          items:
                            oneOf:
