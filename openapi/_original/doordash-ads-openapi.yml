        url:
          type: string
          description: >-
            URL to download the report. This URL expires approximately 30
            minutes after it is generated, so download the report within that
            window. Once the URL has expired, accessing it returns an
            `ExpiredToken` error ("The provided token has expired"). To obtain a
            fresh URL, call the download report endpoint again.
          example: >-
            https://doordash-marketing-save-report-prod.s3.us-west-2.amazonaws.com/...
        name:
          $ref: '#/components/schemas/Name'
        requestedAt:
