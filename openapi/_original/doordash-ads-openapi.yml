            Share reports for US advertisers.

            - <code>"RETAILER"</code> only available to Product Sales and
            Category Share reports for Diamond and Gold tier advertisers.

            - <code>"RETAILER"</code> and <code>"VERTICAL"</code> cannot be both
            requested in the same report.

            - <code>"DISH"</code> only available for Interest Insights reports.
          type: array
