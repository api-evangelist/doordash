                  $ref: '#/components/schemas/AudienceEstimateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    Ads API Key Authentication:
      type: apiKey
      scheme: bearer
      in: header
      name: Authorization
      description: >-
        We will be using stateful token based API keys to authenticate clients,
        passed in the 'Authorization' header as 'Bearer {API_KEY}'.
  parameters:
    campaignType:
      name: campaignType
      in: path
      description: >-
        Indicates campaign type. 'sp' for Sponsored Products or 'sb' for
        Sponsored Brand
      required: true
      schema:
        type: string
    campaignIdFilter:
      name: campaignIdFilter
      in: query
      description: A comma-delimited list of campaign identifiers.
      required: false
      schema:
        type: string
    adGroupIdFilter:
      name: adGroupIdFilter
      in: query
      description: A comma-delimited list of ad group identifiers.
      required: false
      schema:
        type: string
    stateFilter:
      name: stateFilter
      in: query
      description: >-
        Restricts results to resources with state within the specified
        comma-separated list.
      required: false
      schema:
        $ref: '#/components/schemas/StatusRead'
    startIndex:
      name: startIndex
      in: query
      description: 0-indexed record offset for the result set. Defaults to 0.
      schema:
        type: number
        default: 0
    count:
      name: count
      in: query
      description: Number of records to include in the paged response.
      required: false
      schema:
        type: number
    recordType:
      name: recordType
      in: query
      description: >-
        one of: CAMPAIGN, ADGROUP, PRODUCT, KEYWORD, CATEGORY_SHARE,
        PRODUCT_SALES, CATALOG, INTEREST_INSIGHTS
      required: true
      schema:
        - $ref: '#/components/schemas/RecordType'
    campaignId:
      name: campaignId
      in: path
      description: Unique identifier for a campaign
      required: true
      schema:
        type: string
    searchAfter:
      name: searchAfter
      in: query
      description: >
        Null when results included all matching resources. Base64 encoded string
        of the request payload when there are additional resources not included
        within the current result set.
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotAcceptable:
      description: >-
        One or more values specified for a parameter was not within the
        specified acceptable range.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: An invalid parameter was specified.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidQueryParam:
      description: One or more query parameters contained an invalid value.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ResourceNotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: One or more query parameters contained an invalid value.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    CampaignId:
      description: Unique campaign identifier.
      type: string
    AdGroupId:
      description: Unique ad group identifier.
      type: string
    ProductId:
      description: Unique product identifier based on product ID type.
      type: string
    ProductIdType:
      description: Product ID type
      type: string
      enum:
        - GTIN_14
        - UPC
        - DD_SIC
    Name:
      description: Resource name.
      type: string
    Description:
      description: Resource description.
      type: string
    Placement:
      required:
        - type
      properties:
        type:
          description: Specifies an ad group surface
          type: string
          enum:
            - SEARCH
            - CATEGORIES
            - COLLECTION
            - DOUBLEDASH
    StartDate:
      description: >-
        Start date for the resource to go live. The format of the date is
        yyyy-MM-dd HH:mm:ss.
      type: string
      example: '2025-11-01 00:00:00'
    EndDate:
      description: >-
        End date for the resource to stop running. The format of the date is
        yyyy-MM-dd HH:mm:ss.
      type: string
      example: '2025-12-01 00:00:00'
    Date:
      description: A date string in format of yyyy-MM-dd HH:mm:ss
      type: string
      example: '2025-11-01 00:00:00'
    StatusDescription:
      description: Description of the resource is in current state.
      type: string
    StatusRead:
      description: Current resource state.
      type: string
      enum:
        - INCOMPLETE
        - IN_REVIEW
        - SCHEDULED
        - ACTIVE
        - PAUSED
        - ENDED
        - DRAFT
        - REJECTED
        - CANCELLED
    StatusWrite:
      description: Current resource state.
      type: string
      enum:
        - ACTIVE
        - PAUSED
        - ENDED
    Error:
      properties:
        code:
          description: An enumerated error for machine use.
          type: string
          readOnly: true
        details:
          description: A human-readable description of the error.
          type: string
          readOnly: true
    MonetaryFields:
      required:
        - unitAmount
        - currency
      properties:
        unitAmount:
          description: Integer representing a monetary value in cents.
          type: number
        currency:
          description: Monetary value currency
          type: string
          enum:
            - USD
        displayString:
          description: Monetary value formatted for display
          type: string
        decimalPlaces:
          description: Monetary value currency decimal places
          type: number
        symbol:
          description: Monetary value symbol
          type: string
    MonetaryFieldsExtended:
      required:
        - unitAmount
        - currency
        - displayString
        - decimalPlaces
        - symbol
        - symbolPlacement
        - sign
      properties:
        unitAmount:
          description: Integer representing a monetary value in cents.
          type: number
        currency:
          description: Monetary value currency
          type: string
          enum:
            - USD
        displayString:
          description: Monetary value formatted for display
          type: string
        decimalPlaces:
          description: Monetary value currency decimal places
          type: number
        symbol:
          description: Monetary value symbol
          type: string
        symbolPlacement:
          description: Monetary value symbol placement
          type: string
          enum:
            - left
            - right
        sign:
          description: >-
            True indicates the monetary value is positive. False indicates the
            monetary value is negative.
          type: boolean
    Code:
      description: An enumerated success or error code for machine use.
      type: string
    CodeDescription:
      description: A human-readable description of the code.
      type: string
    CreateCampaignRequest:
      required:
        - name
        - campaignType
        - budget
        - startDate
      properties:
        name:
          $ref: '#/components/schemas/Name'
        description:
          $ref: '#/components/schemas/Description'
        budget:
          $ref: '#/components/schemas/BudgetWrite'
        startDate:
          $ref: '#/components/schemas/StartDate'
        endDate:
          $ref: '#/components/schemas/EndDate'
    UpdateCampaignRequest:
      required:
        - campaignId
      properties:
        campaignId:
          $ref: '#/components/schemas/CampaignId'
        name:
          $ref: '#/components/schemas/Name'
        description:
          $ref: '#/components/schemas/Description'
        status:
          $ref: '#/components/schemas/StatusWrite'
        budget:
          $ref: '#/components/schemas/BudgetWrite'
        startDate:
          $ref: '#/components/schemas/StartDate'
        endDate:
          $ref: '#/components/schemas/EndDate'
    CampaignResponse:
      required:
        - campaignId
        - name
        - description
        - status
        - statusDescription
        - code
        - codeDescription
        - campaignType
        - budget
        - startDate
        - endDate
        - placementType
        - permission
      properties:
        campaignId:
          $ref: '#/components/schemas/CampaignId'
        name:
          $ref: '#/components/schemas/Name'
        description:
          $ref: '#/components/schemas/Description'
        status:
          $ref: '#/components/schemas/StatusRead'
        statusDescription:
          $ref: '#/components/schemas/StatusDescription'
        code:
          $ref: '#/components/schemas/Code'
        codeDescription:
          $ref: '#/components/schemas/CodeDescription'
        campaignType:
          $ref: '#/components/schemas/CampaignType'
        budget:
          $ref: '#/components/schemas/BudgetRead'
        startDate:
          $ref: '#/components/schemas/StartDate'
        endDate:
          $ref: '#/components/schemas/EndDate'
        placementType:
          $ref: '#/components/schemas/PlacementType'
        permission:
          $ref: '#/components/schemas/Permission'
    CampaignType:
      description: The advertising product managed by this campaign.
      type: string
      enum:
        - SPONSORED_PRODUCTS
    ReportCampaignTypes:
      description: >
        - Type of campaigns to include in the report.

        - Only relevant for Marketing reports (when recordType is one of
        <code>{CAMPAIGN, ADGROUP, PRODUCT, KEYWORD}</code>).

        - Only one campaign type may be specified per report request.
      type: array
      maxItems: 1
      items:
        $ref: '#/components/schemas/ReportCampaignType'
    ReportCampaignType:
      type: string
      enum:
        - SPONSORED_PRODUCTS
        - SPONSORED_BRAND
    PlacementType:
      description: >-
        Specifies how all ad groups for the campaign will specify placement type
        details.
      type: string
      enum:
        - AUTOMATIC
        - MANUAL
    BudgetWrite:
      properties:
        daily:
          description: Daily budget for the campaign
          properties:
            unitAmount:
              description: Integer representing a monetary value in cents.
              type: number
        lifetime:
          description: Lifetime budget for the campaign
          properties:
            unitAmount:
              description: Integer representing a monetary value in cents.
              type: number
        pacingStrategy:
          $ref: '#/components/schemas/PacingStrategy'
          description: >
            Used to opt into or out of Optimized Pacing. In updates without a
            pacingStrategy specified, the existing pacingStrategy will be
            preserved.

            * `DEMAND` - Spend more of the budget when traffic is high, and less
            when traffic is low. Requires daily budget to be set.

            * `UNSPECIFIED` - Specify to opt out of Optimized Pacing and use the
            default pacing strategy.
      minProperties: 1
      description: At least one of daily or lifetime budget must be configured.
    BudgetRead:
      required:
        - daily
        - lifetime
      properties:
        daily:
          allOf:
            - $ref: '#/components/schemas/MonetaryFieldsExtended'
            - type: object
              description: A daily budget for the campaign
        lifetime:
          allOf:
            - $ref: '#/components/schemas/MonetaryFieldsExtended'
            - type: object
              description: A lifetime budget for the campaign
        pacingStrategy:
          $ref: '#/components/schemas/PacingStrategy'
    Permission:
      required:
        - isReadOnly
        - message
      properties:
        isReadOnly:
          description: Indicates whether a campaign is read-only through the API
          type: boolean
        message:
          description: Description of the campaign permission
          type: string
    BudgetCapoutRecommendationsResponse:
      type: object
      properties:
        adEntityId:
          type: string
          description: ''
        type:
          type: string
          description: ''
        value:
          $ref: '#/components/schemas/RecommendedBudget'
    RecommendedBudget:
      type: object
      properties:
        avgCapOutTimeLast7Days:
          type: number
        recommendedBudget:
          $ref: '#/components/schemas/MonetaryFields'
        totalMissedSalesLast7Days:
          $ref: '#/components/schemas/MonetaryFields'
        dailyCapOutTime:
          type: array
          items:
            $ref: '#/components/schemas/DailyCapOutTime'
    DailyCapOutTime:
      type: object
      properties:
        dayOfWeek:
          $ref: '#/components/schemas/DayOfWeek'
        capOutTime:
          type: number
        maximumLiveHours:
          type: number
    PacingStrategy:
      description: Controls how the budget is distributed over the campaign duration.
      type: string
      enum:
        - DEMAND
        - UNSPECIFIED
      x-enumDescriptions:
        DEMAND: >-
          Spend more of the budget when traffic is high, and less when traffic
          is low.
        UNSPECIFIED: Specify to use the default pacing strategy.
    CreateAdGroupRequest:
      description: >
        **[Beta]** Sponsored Products and Sponsored Brand ad groups support
        stacked targeting. You can combine multiple targeting features in the
        same request when those targeting features are enabled for the
        advertiser and country. Sponsored Products supports dayparting
        (`dayparts`), merchant targeting (`targetBusinessIds`), behavioral
        targeting (`behavioralTargets`), interest targeting (`interestTargets`),
        and keyword targeting (`keywordsBidding`). Sponsored Brand supports
        dayparting (`dayparts`), merchant targeting (`targetBusinessIds`),
        behavioral targeting (`behavioralTargets`), and interest targeting
        (`interestTargets`). Existing campaign type, bid configuration,
        advertiser, and country validation still applies.
      required:
        - campaignId
        - name
        - startDate
        - endDate
        - automaticBid
        - manualTargets
      properties:
        campaignId:
          $ref: '#/components/schemas/CampaignId'
        name:
          $ref: '#/components/schemas/Name'
        startDate:
          $ref: '#/components/schemas/StartDate'
        endDate:
          $ref: '#/components/schemas/EndDate'
        automaticBid:
          $ref: '#/components/schemas/AutomaticBidRequest'
        manualTargets:
          $ref: '#/components/schemas/ManualTargetsRequest'
        targetBusinessIds:
          $ref: '#/components/schemas/TargetBusinessIds'
        behavioralTargets:
          $ref: '#/components/schemas/BehavioralTargetsRequest'
        dayparts:
          description: >
            **[Beta]** Configure custom schedule for when people see this ad
            group campaign.
          type: array
          items:
            $ref: '#/components/schemas/Daypart'
        bidType:
          $ref: '#/components/schemas/BidType'
        bidMinRoas:
          $ref: '#/components/schemas/BidMinRoas'
        interestTargets:
          type: array
          items:
            $ref: '#/components/schemas/InterestTarget'
        keywordsBidding:
          $ref: '#/components/schemas/KeywordsBiddingRequest'
    UpdateAdGroupRequest:
      description: >
        **[Beta]** Sponsored Products and Sponsored Brand ad groups support
        stacked targeting. You can combine multiple targeting features in the
        same request when those targeting features are enabled for the
        advertiser and country. Sponsored Products supports dayparting
        (`dayparts`), merchant targeting (`targetBusinessIds`), behavioral
        targeting (`behavioralTargets`), interest targeting (`interestTargets`),
        and keyword targeting (`keywordsBidding`). Sponsored Brand supports
        dayparting (`dayparts`), merchant targeting (`targetBusinessIds`),
        behavioral targeting (`behavioralTargets`), and interest targeting
        (`interestTargets`). Existing campaign type, bid configuration,
        advertiser, and country validation still applies.
      required:
        - campaignId
        - adGroupId
      properties:
        campaignId:
          $ref: '#/components/schemas/CampaignId'
        adGroupId:
          $ref: '#/components/schemas/AdGroupId'
        name:
          $ref: '#/components/schemas/Name'
        status:
          $ref: '#/components/schemas/StatusWrite'
        startDate:
          $ref: '#/components/schemas/StartDate'
        endDate:
          $ref: '#/components/schemas/EndDate'
        automaticBid:
          $ref: '#/components/schemas/AutomaticBidRequest'
        manualTargets:
          $ref: '#/components/schemas/ManualTargetsRequest'
        keywordsBidding:
          $ref: '#/components/schemas/KeywordsBiddingRequest'
        targetBusinessIds:
          $ref: '#/components/schemas/TargetBusinessIds'
        behavioralTargets:
          $ref: '#/components/schemas/BehavioralTargetsRequest'
        dayparts:
          description: >
            **[Beta]** Custom schedule for when people see this ad group
            campaign.
          type: array
          items:
            $ref: '#/components/schemas/Daypart'
        bidType:
          $ref: '#/components/schemas/BidType'
        bidMinRoas:
          $ref: '#/components/schemas/BidMinRoas'
        interestTargets:
          type: array
          items:
            $ref: '#/components/schemas/InterestTarget'
    AdGroupResponse:
      required:
        - campaignId
        - adGroupId
        - name
        - status
        - statusDescription
        - startDate
        - endDate
      properties:
        campaignId:
          $ref: '#/components/schemas/CampaignId'
        adGroupId:
          $ref: '#/components/schemas/AdGroupId'
        name:
          $ref: '#/components/schemas/Name'
        status:
          $ref: '#/components/schemas/StatusRead'
        statusDescription:
          $ref: '#/components/schemas/StatusDescription'
        startDate:
          $ref: '#/components/schemas/StartDate'
        endDate:
          $ref: '#/components/schemas/EndDate'
        automaticBid:
          allOf:
            - $ref: '#/components/schemas/BidRead'
            - type: object
              description: Bid for all ad group placement types
        code:
          $ref: '#/components/schemas/Code'
        codeDescription:
          $ref: '#/components/schemas/CodeDescription'
        manualTargets:
          type: array
          items:
            $ref: '#/components/schemas/ManualTargetRead'
        keywordsBidding:
          type: array
          items:
            $ref: '#/components/schemas/KeywordsBiddingRead'
        targetBusinessIds:
          $ref: '#/components/schemas/TargetBusinessIds'
        behavioralTargets:
          type: array
          items:
            $ref: '#/components/schemas/BehavioralTargetResponse'
        dayparts:
          type: array
          items:
            $ref: '#/components/schemas/Daypart'
        bidType:
          $ref: '#/components/schemas/BidType'
        bidMinRoas:
          $ref: '#/components/schemas/BidMinRoas'
        interestTargets:
          type: array
          items:
            $ref: '#/components/schemas/InterestTarget'
    BidWrite:
      required:
        - price
      properties:
        price:
          description: Integer representing a monetary value in cents.
          properties:
            unitAmount:
              description: Integer representing a monetary value in cents.
              type: number
    BidRead:
      required:
        - price
      properties:
        price:
          $ref: '#/components/schemas/MonetaryFieldsExtended'
    AutomaticBidRequest:
      allOf:
        - $ref: '#/components/schemas/BidWrite'
        - type: object
          description: >
            Bid for all ad group placement types. Either automaticBid OR
            manualTargets must be set.


            Bid unitAmount range per advertiser country code is outlined in the
            following table. Ranges are presented as 'Minimum-Maximum'.


            | Country code (currency) | Minimum-Maximum |

            |-------------------|-----------------|

            | US (USD) | 80-10,000 |

            | CA (CAD) | 80-10,000 |

            | AU (AUD) | 80-10,000 |
    ManualTargetsRequest:
      type: array
      items:
        $ref: '#/components/schemas/ManualTargetWrite'
      description: >
        **Sponsored Products only.** Bid for specific ad group placement types.
        Either automaticBid OR manualTargets must be set. 


        Supported ad group placement type combinations are represented in the
        following table.


        | Valid combinations |

        |-------------------|

        | CATEGORIES, COLLECTION, SEARCH, and DOUBLEDASH |

        | CATEGORIES, COLLECTION, and SEARCH |

        | DOUBLEDASH only |


        Bid unitAmount range per advertiser country code per placement type is
        outlined in the following table. Ranges are presented as
        'Minimum-Maximum'.


        | Placement type | US (USD) | CA (CAD) | AU (AUD) |

        |-------------------|-------------------|-------------------|-------------------|

        | CATEGORIES | 40-10,000 | 30-10,000 | 40-10,000 |

        | COLLECTION | 30-10,000 | 40-10,000 | 50-10,000 |

        | SEARCH | 60-10,000 | 40-10,000 | 50-10,000 |

        | DOUBLEDASH | 80-10,000 | 80-10,000 | 80-10,000 |
    ManualTargetWrite:
      required:
        - bid
        - placement
      properties:
        bid:
          allOf:
            - $ref: '#/components/schemas/BidWrite'
            - type: object
              description: Bid for a specific ad group placement type
        placement:
          $ref: '#/components/schemas/Placement'
    ManualTargetRead:
      required:
        - bid
        - placement
      properties:
        bid:
          allOf:
            - $ref: '#/components/schemas/BidRead'
            - type: object
              description: Bid for a specific ad group placement type
        placement:
          $ref: '#/components/schemas/Placement'
    KeywordsBiddingRequest:
      description: >
        **Sponsored Products only.** Keyword search bidding configuration to
        customize the audience of this ad group campaign.
      type: array
      items:
        $ref: '#/components/schemas/KeywordsBiddingWrite'
    KeywordsBiddingWrite:
      required:
        - bid
        - placement
        - targetKeywords
      properties:
        bid:
          allOf:
            - $ref: '#/components/schemas/BidWrite'
            - type: object
              description: >-
                Bid for list of keywords under a specific ad group placement
                type. Zero unit amount will be excluded keywords.
        placement:
          $ref: '#/components/schemas/Placement'
        targetKeywords:
          type: array
          minItems: 1
          maxItems: 40
          items:
            type: string
    KeywordsBiddingRead:
      required:
        - bid
        - placement
        - targetKeywords
      properties:
        bid:
          allOf:
            - $ref: '#/components/schemas/BidRead'
            - type: object
              description: >-
                Bid for list of keywords under a specific ad group placement
                type. Zero unit amount will be excluded keywords.
        placement:
          $ref: '#/components/schemas/Placement'
        targetKeywords:
          type: array
          minItems: 1
          maxItems: 40
          items:
            type: string
    BehavioralTargetsRequest:
      type: array
      items:
        $ref: '#/components/schemas/BehavioralTargetWrite'
      description: >
        Behavioral targeting configuration to customize the audience of this ad
        group campaign.
    BehavioralTargetWrite:
      required:
        - action
        - resources
      properties:
        action:
          $ref: '#/components/schemas/TargetingAction'
        resources:
          type: object
          properties:
            type:
              $ref: '#/components/schemas/ResourceType'
            ids:
              type: array
              items:
                type: number
    BehavioralTargetResponse:
      required:
        - action
        - resources
      properties:
        action:
          $ref: '#/components/schemas/TargetingAction'
        resources:
          type: object
          properties:
            type:
              $ref: '#/components/schemas/ResourceType'
            objects:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  status:
                    type: string
                    enum:
                      - INELIGIBLE
    TargetingAction:
      type: string
      enum:
        - LAPSED
        - INCLUDE_ANY
        - EXCLUDE_ANY
    TimeOfDay:
      type: object
      properties:
        hours:
          type: number
        minutes:
          type: number
        seconds:
          type: number
        nanos:
          type: number
    TimeOfDayOfWeek:
      type: object
      properties:
        dayOfWeek:
          $ref: '#/components/schemas/DayOfWeek'
        timeOfDay:
          $ref: '#/components/schemas/TimeOfDay'
    DayOfWeek:
      type: string
      enum:
        - MONDAY
        - TUESDAY
        - WEDNESDAY
        - THURSDAY
        - FRIDAY
        - SATURDAY
        - SUNDAY
        - UNSPECIFIED
    Daypart:
      type: object
      properties:
        startTimeOfDayOfWeek:
          $ref: '#/components/schemas/TimeOfDayOfWeek'
        endTimeOfDayOfWeek:
          $ref: '#/components/schemas/TimeOfDayOfWeek'
    TargetBusinessIds:
      type: array
      items:
        type: string
      description: |
        Business IDs for merchant targeting (domestic, non-alcohol only).
    BidType:
      type: string
      enum:
        - AUTOMATED
        - MANUAL
      description: >
        **Sponsored Products US market only.**

        Configure the AUTOMATED BidType to enable a new bidding strategy:
        Automatic Bidding. This strategy automatically sets and adjusts your
        bids in real-time to maximize clicks at the lowest cost.


        When choosing Automatic Bidding with the AUTOMATED BidType,
        manualTargets must be set. Bid in manualTargets is not required.


        All ad groups within the same campaign must use the same BidType.
        Specifying different BidTypes is not allowed.
    BidMinRoas:
      minimum: 0.1
      exclusiveMinimum: false
      maximum: 6
      exclusiveMaximum: false
      type: double
      example: 2
      description: >
        Specify the BidMinRoas value when configuring the Automatic Bidding
        strategy.


        Choose a minimum ROAS that aligns with your campaign goals. If not
        specified, a default minimum guardrail of 2.0x will be applied.


        All ad groups within the same campaign must use the same bidMinRoas.
        Although bidMinRoas is set at the ad group level, it is applied at the
        campaign level — updating bidMinRoas on any ad group will set the same
        value across all ad groups within the campaign.
    InterestTarget:
      type: object
      required:
