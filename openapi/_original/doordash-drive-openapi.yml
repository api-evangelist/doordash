      description: >-
        Create a delivery. Learn how to use this API in one of our tutorials:
        [call the API directly from any language or
        tool](https://developer.doordash.com/en-US/docs/drive/tutorials/get_started),
        [create deliveries using our Node.js
        SDK](https://developer.doordash.com/en-US/docs/drive/tutorials/get_started_sdk),
        or [use Postman to call the
        APIs](https://developer.doordash.com/en-US/docs/drive/tutorials/get_started_postman).
      operationId: CreateDelivery
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeliveryInput'
        required: true
      responses:
        '200':
          description: Ok
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
        '400':
          description: Request Validation Failed
          headers: {}
          content:
            application/json:
