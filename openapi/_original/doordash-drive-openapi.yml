          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/missing_dependency_error'
        '500':
          description: Internal service failure, please try again later
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server_fault'
      deprecated: false
    get:
      summary: List Stores
      tags:
        - Business & Store
      description: List the stores under a business.
      operationId: ListStore
      parameters:
        - $ref: '#/components/parameters/PathExternalBusinessId'
        - in: query
          name: activationStatus
          schema:
            $ref: '#/components/schemas/StoreActivationStatus'
        - in: query
          name: continuationToken
          schema:
            type: string
            description: >-
              Opaque string that can be used to fetch next page of stores, the
              token value will be null if there are no more stores to fetch.
              Page size is 100 stores.
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStoreList'
        '400':
          description: Request validation failed
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validation_field_error'
        '403':
          description: Operation not authorized
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authorization_error'
        '404':
          description: Unknown external business ID
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unknown_business_error'
        '500':
          description: Internal service failure, please try again later
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server_fault'
      deprecated: false
components:
