openapi: 3.0.0
info:
  title: Drive API
  x-logo:
    url: >-
      https://doordash-static.s3-us-west-2.amazonaws.com/media/drive/drive-logo.png
    backgroundColor: '#FFFFFF'
    altText: Doordash Drive
    href: https://developer.doordash.com/
  version: 2.1.59
  description: ''
servers:
  - url: https://openapi.doordash.com
    variables: {}
tags:
  - name: Delivery
    x-displayName: Delivery
  - name: Audit
    x-displayName: Audit
  - name: Address
    x-displayName: Address
  - name: Business & Store
    x-displayName: Business & Store
paths:
  /drive/v2/quotes:
    post:
      summary: Create Quote
      tags:
        - Delivery
      description: >-
        Confirm that a delivery is serviceable by DoorDash and what it would
        cost by creating a quote. Get a quote on delivery fee and validate
        coverage. Learn how to use this API in the [Create & Accept Quotes
        how-to
        guide](https://developer.doordash.com/en-US/docs/drive/how_to/quote_deliveries).
      operationId: DeliveryQuote
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryQuoteInput'
        required: true
      responses:
        '200':
          description: Ok
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
        '400':
          description: Request Validation Failed
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validation_field_error'
        '401':
          description: Request unauthorized
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authentication_error'
        '403':
          description: Operation not authorized
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authorization_error'
        '409':
          description: Duplicate delivery ID
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateDeliveryIdError'
        '422':
          description: Delivery is not allowed
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidDeliveryError'
        '500':
          description: Internal service failure, please try again later
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server_fault'
      deprecated: false
  /drive/v2/quotes/{external_delivery_id}/accept:
    post:
      summary: Accept Quote
      tags:
        - Delivery
      description: >-
        When you’re happy with the quote you created, start the delivery process
        by accepting the quote. Learn how to use this API in the [Create &
        Accept Quotes how-to
        guide](https://developer.doordash.com/en-US/docs/drive/how_to/quote_deliveries).
      operationId: DeliveryQuoteAccept
      parameters:
        - $ref: '#/components/parameters/ExternalDeliveryIdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryQuoteAcceptInput'
        required: false
      responses:
        '200':
          description: Ok
          headers: {}
          content:
            application/json:
              schema:
