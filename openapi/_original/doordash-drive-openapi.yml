  /developer/v1/businesses:
    post:
      summary: Create Business
      tags:
        - Business & Store
      description: >-
        Create a Drive business. You cannot create a business with string
        "default" as external_business_id. "default" is reserved for
        automatically created business during developer onboarding.
      operationId: CreateBusiness
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBusinessInput'
        required: true
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        '400':
          description: Request validation failed
          headers: {}
          content:
            application/json:
              schema:
