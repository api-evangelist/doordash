      deprecated: false
  /drive/v2/deliveries/{external_delivery_id}/cancel:
    put:
      summary: Cancel Delivery
      tags:
        - Delivery
      description: >-
        Cancel a delivery. Deliveries can't be cancelled after a Dasher is
        assigned. For cold chain compliance use-cases, we create return
        deliveries instead as items are already picked up. Use the optional
        request body to specify if cancellation is due to cold chain compliance
      operationId: CancelDelivery
      parameters:
        - $ref: '#/components/parameters/ExternalDeliveryIdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelDeliveryInput'
        required: false
      responses:
        '200':
          description: Ok
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
        '400':
          description: Request Validation Failed
          headers: {}
