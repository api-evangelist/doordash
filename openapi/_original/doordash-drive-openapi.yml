      deprecated: false
  /drive/v2/deliveries/{external_delivery_id}:
    get:
      summary: Get Delivery
      tags:
        - Delivery
      description: >-
        Get the status and details of a delivery that you created. If you want
        to proactively receive updates about your delivery, set up [webhooks
        using the webhooks how-to
        guide](https://developer.doordash.com/en-US/docs/drive/how_to/webhooks).
      operationId: GetDelivery
      parameters:
        - $ref: '#/components/parameters/ExternalDeliveryIdPath'
      responses:
        '200':
          description: Ok
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
        '400':
          description: Request Validation Failed
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validation_field_error'
        '401':
          description: Request unauthorized
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authentication_error'
        '403':
          description: Operation not authorized
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authorization_error'
        '404':
          description: Unknown delivery ID
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unknown_delivery_error'
        '500':
          description: Internal service failure, please try again later
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server_fault'
      deprecated: false
    patch:
      summary: Update Delivery
      tags:
        - Delivery
      description: >-
        Update the details of a delivery. Only the fields listed below can be
        updated; to update other fields, you need to cancel the delivery and
        then create a new one.
      operationId: UpdateDelivery
      parameters:
        - $ref: '#/components/parameters/ExternalDeliveryIdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeliveryInput'
        required: true
      responses:
        '200':
          description: Ok
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
        '400':
          description: Request Validation Failed
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validation_field_error'
        '401':
          description: Request unauthorized
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authentication_error'
        '403':
          description: Operation not authorized
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authorization_error'
        '404':
          description: Unknown delivery ID
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unknown_delivery_error'
        '409':
          description: Update is not allowed
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateNotAllowedError'
        '422':
          description: Delivery is not allowed
