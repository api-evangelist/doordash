        '500':
          description: Internal service failure, please try again later
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server_fault'
      deprecated: false
    get:
      summary: List Businesses
      tags:
        - Business & Store
      description: List the businesses owned by a developer.
      operationId: ListBusiness
      parameters:
        - in: query
          name: activationStatus
          schema:
            $ref: '#/components/schemas/BusinessActivationStatus'
        - in: query
          name: continuationToken
          schema:
            type: string
            description: >-
              Opaque string that can be used to fetch next page of businesses,
              the token value will be null if there are no more businesses to
              fetch. Page size is 100 businesses.
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBusinessList'
        '400':
          description: Request validation failed
          headers: {}
