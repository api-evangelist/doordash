  /developer/v1/businesses/{external_business_id}/stores:
    post:
      summary: Create Store
      tags:
        - Business & Store
      description: >-
        Create a Drive store. To create a store for your developer's default
        business please create stores under "default" external_business_id. We
        recommend this route if you are either an enterprise or a developer who
        plan to manage only one business.
      operationId: CreateStore
      parameters:
        - $ref: '#/components/parameters/PathExternalBusinessId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoreInput'
