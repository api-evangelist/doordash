  /drive/v2/serviceability:
    post:
      summary: Check Serviceability
      tags:
        - Delivery
      description: >-
        Check if delivery is serviceable for a given pickup and dropoff location
        combination. Please provide pickup_external_business_id and
        pickup_external_store_id for faster store lookup. Other optional fields
        are validated if provided.
      operationId: CheckServiceability
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceabilityCheckInput'
        required: true
