          type: number
        base_price_per_measurement_unit:
          description: base price per measurement unit(kg, lb) in cents for weighted items
          type: number
        loyalty_price:
          description: price in cents for loyalty members
          type: number
        loyalty_price_per_measurement_unit:
          description: >-
            loyalty price in cents per measurement unit(kg, lb) in cents for
            weighted items
          type: number
        sale_price_per_measurement_unit:
          description: >-
            sale price in cents per measurement unit(kg, lb) in cents for
            weighted items
          type: number
    OptionPriceInfo:
      type: object
