        price_info:
          $ref: '#/components/schemas/PriceInfo'
        location:
          $ref: '#/components/schemas/ItemLocation'
        item_special_hours:
          type: array
          description: Special hours on when item will be available
          items:
            $ref: '#/components/schemas/TimeBlock'
        program_eligibility:
          type: array
          description: Program eligibility of the item
          items:
            $ref: '#/components/schemas/ProgramEligibility'
        extras:
          type: array
          items:
            $ref: '#/components/schemas/Extra'
      type: object
    StoreItemExtras:
      type: object
      properties:
        merchant_supplied_extras_id:
          type: string
        options:
          type: array
          items:
            type: object
            properties:
              merchant_supplied_id:
                type: string
              price_info:
                $ref: '#/components/schemas/PriceInfo'
    _StoreItemExtras:
      type: object
      properties:
        merchant_supplied_extras_id:
          type: string
        options:
          type: array
          items:
            type: object
            properties:
              merchant_supplied_id:
                type: string
              price_info:
                $ref: '#/components/schemas/PriceInfo'
    PriceInfo:
      type: object
      properties:
        base_price:
          description: base price in cents. For example, 12.99$ should be specified as 1299
          type: number
        sale_price:
          description: sale price in cents, For example, 8.50$ should be specified as 850
          type: number
        tax_rate:
          description: >-
            tax rate as percent value. For example, Tax rate of seven and a half
            percent must be specified as 7.5.
          type: number
        bottle_fee_deposit:
          description: >-
            bottle fee deposit in cents. For example, 1.25$ must be specified as
