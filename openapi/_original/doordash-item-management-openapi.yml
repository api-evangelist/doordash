      x-codegen-request-body-name: body
      deprecated: false
  /api/v2/nv_multi_location_onboarding_intent:
    post:
      tags:
        - NewVerticalsSelfServeIntegrationEndpoints
      summary: Submit onboarding intent for multiple store locations in a single batch
      description: >-
        Batch sibling of managed_merchant_connect_url for NV SSIO
        partner-initiated merchant onboarding - submits onboarding intent for
        multiple store locations in one call. Unlike
        managed_merchant_connect_url, no onboarding URL is returned; onboarding
        completion for accepted locations is a manual DoorDash-rep follow-up.
        Each location in the batch is processed independently, so a per-location
        failure does not fail the rest of the batch - see the results array in
        the response.
      operationId: submitMultiLocationOnboardingIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultiLocationOnboardingIntentRequest'
      responses:
        '200':
          description: >-
            Batch received - see the per-location results array for individual
            outcomes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiLocationOnboardingIntentResponse'
        '400':
          description: Request Validation Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFieldError'
        '401':
          description: Request unauthorized
          content:
            application/json:
