  /api/v2/stores/{store_location_id}/checkout/transactions/auth:
    post:
      tags:
        - CheckoutManagementEndpoints
      summary: Authorize a checkout transaction
      description: >-
        Authorize a transaction for checkout. Only supported when transaction
        method is DOORDASH_DIRECT. Transaction authorization retries will be
        successful only when the checkout session is in active state. The
        checkout session will be closed once the Dasher is able to proceed to
        checkout or when Mx sends a transaction complete signal to the Events
        API.
      operationId: authorizeTransaction
      parameters:
        - name: store_location_id
          in: path
          description: ID of store where checkout is occurring
          required: true
          schema:
            type: string
            format: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionAuthRequest'
      responses:
        '200':
          description: Transaction authorization response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionAuthResponse'
        '400':
          description: Request Validation Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFieldError'
        '401':
          description: Request unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
