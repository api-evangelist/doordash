    backgroundColor: '#FFFFFF'
    altText: Doordash Marketplace
    href: https://developer.doordash.com/
servers:
  - url: https://openapi.doordash.com/marketplace
tags:
  - name: ItemManagementEndpoints
    x-displayName: Item Management Endpoints
    description: Endpoints for item management
  - name: StoreManagementEndpoints
    x-displayName: Store Management Endpoints
    description: Endpoints for managing stores
  - name: InventoryManagementEndpoints
    x-displayName: Inventory/Pricing Management Endpoints
    description: >-
      Endpoints to manage inventory/pricing and other item attributes specific
      to this store
  - name: JobManagementEndpoints
    x-displayName: Job Management endpoints
    description: Endpoints to create jobs to support pull request flows.
  - name: PromotionManagementEndpoints
    x-displayName: Promotion Management Endpoints
    description: Endpoints for promotion management
  - name: NewVerticalsSelfServeIntegrationEndpoints
    x-displayName: New Verticals Self-Serve Integration Onboarding
    description: Endpoints for new verticals self-serve integration onboarding
  - name: CheckoutManagementEndpoints
    x-displayName: Checkout Management Endpoints
    description: Endpoints for managing checkout and transactions
  - name: ItemManagementModels
    x-displayName: Models
    description: >
      ## Item

      <SchemaDefinition schemaRef="#/components/schemas/Item" />


      ## Store

      <SchemaDefinition schemaRef="#/components/schemas/Store" />


      ## StoreItem

      <SchemaDefinition schemaRef="#/components/schemas/StoreItem" />


      ## Promotion

      <SchemaDefinition schemaRef="#/components/schemas/Promotion" />


      ## BatchAddOrUpdateItemRequest

      <SchemaDefinition
      schemaRef="#/components/schemas/BatchAddOrUpdateItemRequest" />


      ## BatchAddOrUpdateStoreItemRequest

      <SchemaDefinition
      schemaRef="#/components/schemas/BatchAddOrUpdateStoreItemRequest" />


      ## UpdateItemsInBusinessRequest

      <SchemaDefinition
      schemaRef="#/components/schemas/UpdateItemsInBusinessRequest" />


      ## CreateJobRequest

      <SchemaDefinition schemaRef="#/components/schemas/CreateJobRequest" />


      ## CreatePullStoreItemsJobParameters

      <SchemaDefinition
      schemaRef="#/components/schemas/PullStoreItemsJobParameters" />


      ## BatchAddOrUpdatePromotionRequest
           <SchemaDefinition schemaRef="#/components/schemas/BatchAddOrUpdatePromotionRequest" />
  - name: CheckoutManagementModels
    x-displayName: Checkout Models
    description: >
      ## BatchAddTransactionRequest

      <SchemaDefinition
      schemaRef="#/components/schemas/BatchAddTransactionRequest" />


      ## CardTransactionInfo

      <SchemaDefinition schemaRef="#/components/schemas/CardTransactionInfo" />


      ## DiscountInfo

      <SchemaDefinition schemaRef="#/components/schemas/DiscountInfo" />


      ## FeeInfo

      <SchemaDefinition schemaRef="#/components/schemas/FeeInfo" />


      ## LoyaltyMemberInfo

      <SchemaDefinition schemaRef="#/components/schemas/LoyaltyMemberInfo" />


      ## OtherIdentifier

      <SchemaDefinition schemaRef="#/components/schemas/OtherIdentifier" />


      ## TaxInfo

      <SchemaDefinition schemaRef="#/components/schemas/TaxInfo" />


      ## Tender

      <SchemaDefinition schemaRef="#/components/schemas/Tender" />


      ## Transaction

      <SchemaDefinition schemaRef="#/components/schemas/Transaction" />


      ## TransactionAuditResult

      <SchemaDefinition schemaRef="#/components/schemas/TransactionAuditResult"
      />


      ## TransactionAuthRequest

      <SchemaDefinition schemaRef="#/components/schemas/TransactionAuthRequest"
      />


      ## TransactionAuthResponse

      <SchemaDefinition schemaRef="#/components/schemas/TransactionAuthResponse"
      />


      ## TransactionContent

      <SchemaDefinition schemaRef="#/components/schemas/TransactionContent" />


      ## TransactionLineItem

      <SchemaDefinition schemaRef="#/components/schemas/TransactionLineItem" />


      ## TransactionSummary

      <SchemaDefinition schemaRef="#/components/schemas/TransactionSummary" />
paths:
  /api/v2/items:
    post:
      tags:
        - ItemManagementEndpoints
      summary: Add new items
      description: >-
        Add new items managed by business. Items sold across all stores must be
        added to business first. Items must be uniquely identifiable across
        stores. As of now, only one businessId must be specified. Request
        validation will fail if no businessId or multiple businessIds are
        specified.
      operationId: batchAddItems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchAddOrUpdateItemRequest'
      responses:
        '201':
          description: Ok
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncOperationResponse'
        '400':
          description: Request Validation Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFieldError'
        '401':
          description: Request unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '422':
          description: Request Entity Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestNotProcessError'
        '429':
          description: Request is rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestRateLimitedError'
        '500':
          description: Internal service failure, please try again later
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server_fault'
      x-codegen-request-body-name: body
      deprecated: false
    patch:
      tags:
        - ItemManagementEndpoints
      summary: Update existing items
      description: Update existing items managed by business.
      operationId: batchUpdateItems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchAddOrUpdateItemRequest'
      responses:
        '200':
