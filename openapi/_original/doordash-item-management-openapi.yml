components:
  schemas:
    Item:
      title: Item
      description: >-
        Item to be managed by doordash. Should be unique across stores within
        business.
      properties:
        merchant_supplied_item_id:
          type: string
          description: >-
            Merchant supplied Id to identify an item uniquely within business
            across all stores. Every item that is shopable by CX must be
            represented as an unique item
        name:
          type: string
          description: Name of the item
        description:
          type: string
          description: Description of the item
        product_traits:
          type: array
          items:
            $ref: '#/components/schemas/ProductTrait'
          description: >-
            Specifies type of product(s) represented by the item. These
            attributes will be used to validate product specific attributes in
            request and apply product specific business logic internally. For
            example, when WEIGHTED is specified as one of the product trait,
            presence of weighted_item_info will be validated in the request
            payload
        other_identifiers:
          type: array
          description: Other identifiers associated with item.
          items:
            type: object
            properties:
              identifier_type:
                type: string
                description: >-
                  Identifier type for item. Note: NSC2 and GTIN are not fully
                  supported yet. Please contact support if you need to use these
                  identifiers.
                enum:
                  - UPC
                  - PLU
                  - NSC2
                  - GTIN
              identifier_value:
                type: string
                description: identifier value
        images:
          type: array
          description: Images of the item, atleast one image must be specified
          items:
            type: object
            properties:
              url:
                type: string
              sort_id:
                type: integer
                description: >-
                  order in which images should be displayed, 0 will be the
                  primary image
        size:
          type: object
          description: size of the item
          properties:
            details:
              $ref: '#/components/schemas/SizeInfo'
            pack_size_details:
              type: object
              description: item size details per pack
              properties:
                count_per_pack:
                  description: Count per pack
                  type: integer
                per_item_size_details:
                  $ref: '#/components/schemas/SizeInfo'
        weighted_item_info:
          type: object
          description: attributes related to items that are sold by weights
          properties:
            average_weight_per_each:
              type: number
              description: Average weight per each item or pack
            average_weight_measurement_unit:
              type: string
              enum:
                - ea
                - kg
                - lb
                - gm
                - oz
              default: ea
              description: unit of measurement (ea, kg, lb, gm, oz)
            shop_by_measurement_unit:
              type: string
              enum:
                - ea
                - kg
                - lb
                - gm
                - oz
              description: How the item is shown to customers
            price_by_measurement_unit:
              type: string
              enum:
                - ea
                - kg
                - lb
                - gm
                - oz
              description: How the item is priced
        brand_info:
          type: object
          description: brand of the item if applicable
          properties:
            name:
              type: string
              description: Name of the brand
        program_eligibility:
          type: array
          description: Program eligibility of the item
          items:
            $ref: '#/components/schemas/ProgramEligibility'
        item_categorizations:
          type: array
          description: One or more categories associated with the item
          items:
            type: object
            properties:
              category:
                $ref: '#/components/schemas/Category'
        product_attributes:
          type: array
          description: >-
            product_attributes allow us to infer everything about an item
            necessary for customers to shop, dasher to fulfill, merchants to
            merchandise, and advertisers to advertise. See supported full
            attribute list:
            https://developer.doordash.com/en-US/docs/marketplace/retail/catalog_management/supported_attribute
          items:
            $ref: '#/components/schemas/ProductAttributes'
    ProductTrait:
      type: string
      enum:
        - ALCOHOL
        - MEDICATION
        - WEIGHTED
    ProgramEligibility:
      description: Eligibility to items for various programs
      type: string
      enum:
        - SNAP
        - HSA
        - FSA
    TimeBlock:
      type: object
      properties:
        day_index:
          type: string
          enum:
            - MON
            - TUE
            - WED
            - THU
            - FRI
            - SAT
            - SUN
        start_time:
          type: string
          format: HH:MM:SS
        end_time:
          type: string
          format: HH:MM:SS
        start_date:
          type: string
        end_date:
          type: string
    ItemLocation:
      type: object
      description: >-
        Default location of an item in the store across business. Can be
        specified at store level for any store specific customizations.
      properties:
        aisle:
          type: string
        zone:
          type: string
        shelf:
          type: string
        side:
          type: string
        additional_details:
          type: string
        coordinates:
          type: object
          properties:
            x:
              type: integer
            'y':
              type: integer
        raw_text:
          description: Raw text is the unparsed raw data that comes from merchants.
          type: string
        section:
          description: Section is where the item is located at.
          type: string
    SizeInfo:
      type: object
      properties:
        dimensions:
          type: object
          properties:
            length:
              type: object
              properties:
                value:
                  type: number
                unit:
                  type: string
                  enum:
                    - inch
                    - ft
                    - cm
                    - m
            width:
              type: object
              properties:
                value:
                  type: number
                unit:
                  type: string
                  enum:
                    - inch
                    - ft
                    - cm
                    - m
            height:
              type: object
              properties:
                value:
                  type: number
                unit:
                  type: string
                  enum:
                    - inch
                    - ft
                    - cm
                    - m
        weight:
          type: object
          properties:
            value:
              type: number
            unit:
              type: string
              enum:
                - lbs
                - gm
                - kg
                - ea
                - oz
        volume:
          type: object
          properties:
            value:
              type: number
            unit:
              type: string
              enum:
                - oz
                - mL
                - L
        product_specific_size_definition:
          type: object
          description: >-
            Product-specific size information with separate numeric value and
            unit of measurement
          properties:
            value:
              type: string
              description: Numeric value only
              example: '400'
            description:
              type: string
              description: Unit of measurement only
              example: g
    StoreItem:
      properties:
        merchant_supplied_item_id:
          type: string
        item_availability:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
        balance_on_hand:
          type: integer
        funding_source:
          type: string
          enum:
            - MERCHANT
            - CPG
        last_sold_datetime:
          type: string
          description: >-
            DateTime in ISO8601 format of when the item was last sold at the
