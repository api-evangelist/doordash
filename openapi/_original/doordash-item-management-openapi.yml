          type: integer
          description: >-
            Controls the quantity of an individual option within the extra that
            must be added to the item.
        max_option_choice_quantity:
          type: integer
          description: >-
            Controls the quantity of an individual option within the extra that
            can be added to the item.
        min_aggregate_options_quantity:
          type: integer
          description: >-
            Limits the quantity of a single option that can be added within the
            extra To offer quantity selectors as the selection method, this must
            be specified.
        max_aggregate_options_quantity:
          type: integer
          description: >-
            Limits the quantity of a single option that can be added within the
            extra To offer quantity selectors as the selection method, this must
            be specified.
        options:
          type: array
          items:
            $ref: '#/components/schemas/NestedL2Option'
    NestedL2Option:
      type: object
      properties:
        merchant_supplied_item_id:
          type: string
          description: Merchant supplied Id to identify the option inside the extra.
        name:
          type: string
          description: Name of the option
        availability:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
          default: ACTIVE
        price_info:
          $ref: '#/components/schemas/PriceInfo'
        item_extra_option_special_hours:
          type: array
          description: Special hours on when option will be available
          items:
            $ref: '#/components/schemas/TimeBlock'
        description:
          type: string
          description: Description of the option
        default:
          type: boolean
          description: >-
            Controls whether the option is pre-selected or not.  For options
            that have quantity selectors, if option.default:true, then the
            pre-selected quantity will be 1
        sort_id:
          type: integer
          description: >-
            Dictates option sort order, DoorDash sorts options based in
            ascending order by referencing this field (i.e. sort_id does not
            have to be 0 in order for option to be sorted to the top)
        operation_context:
          type: array
          description: >-
            Controls whether the option is part of the recipe or not. Must
            contain “RECIPE” in order for default_quantity and charge_above to
            work as expected
          items:
            type: string
        quantity_info:
          type: object
          $ref: '#/components/schemas/QuantityInfo'
        dish_info:
          type: object
          description: Dietary information
          $ref: '#/components/schemas/DishInfo'
    BatchAddOrUpdateItemRequest:
      type: object
      properties:
        scope:
          type: object
          properties:
            business_ids:
              type: array
              items:
                type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
    BatchAddOrUpdateStoreItemRequest:
      type: object
      properties:
        meta:
          type: object
          description: Only need this information when you use paginated pull workflow
          properties:
            current_page:
              type: integer
              description: optional
            page_size:
              type: integer
              description: optional
            total_page:
              type: integer
              description: required
        items:
          type: array
          items:
            $ref: '#/components/schemas/StoreItem'
    UpdateItemsInBusinessRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: >-
            Items whose business-level attributes should be updated across every
            live store in the business.
          items:
            $ref: '#/components/schemas/StoreItem'
    CreateJobRequest:
      type: object
      properties:
        job_type:
          type: string
          enum:
            - PULL_STORE_ITEMS
            - PULL_STORE_ITEMS_WITH_PAGINATION
          description: >-
            Use PULL_STORE_ITEMS if you can return all items in one pull call
            for one store, otherwise use PULL_STORE_ITEMS_WITH_PAGINATION which
            is paginated version pull.
        job_parameters:
          type: object
          additionalProperties:
            type: string
    BatchAddOrUpdatePromotionRequest:
      type: object
      properties:
        promotions:
          type: array
          items:
            $ref: '#/components/schemas/Promotion'
    PullStoreItemsJobParameters:
      type: object
      properties:
        store_location_id:
          type: string
        pull_mode:
          type: string
          enum:
            - REPLACE
        merchant_supplied_page_size:
          type: integer
    AsyncOperationResponse:
      type: object
      properties:
        operation_id:
          type: string
        operation_status:
          type: string
          enum:
            - QUEUED
            - IN_PROGRESS
            - SUCCESS
            - FAILED
            - PARTIAL_SUCCESS
        message:
          type: string
    PullStoreItemsJobResponse:
      type: object
      properties:
        operation_id:
          type: string
        operation_status:
          type: string
          enum:
            - QUEUED
            - IN_PROGRESS
            - SUCCESS
            - FAILED
            - PARTIAL_SUCCESS
        message:
          type: string
        max_page_size:
          type: integer
    ManagedMerchantConnectRequest:
      type: object
      required:
        - location_id
        - location_group_id
        - store_name
        - address
        - first_name
        - last_name
        - email
        - merchant_decision_maker_email
        - order_protocol
        - fulfillment_protocol
        - locale
      properties:
        location_id:
          type: string
          description: >-
            Unique identifier of the store in partner system (becomes
            location_id in API calls)
        location_group_id:
          type: string
          description: Unique identifier of the parent business in partner system
        store_name:
          type: string
          description: Customer-facing name of the store (e.g., "Burger Shack")
        location_name:
          type: string
          description: Location-specific context (e.g., "Burger Shack - Las Vegas")
        address:
          $ref: '#/components/schemas/MerchantAddress'
        first_name:
          type: string
          description: First name of user on partner side initiating request
        last_name:
          type: string
          description: Last name of user on partner side
        email:
          type: string
          format: email
          description: Email for user on partner side (receives status updates)
        business_phone:
          type: string
          description: Phone number for requestor
        expected_go_live_date:
          type: string
          format: date
          description: Expected activation date (YYYY-MM-DD, best effort)
          example: '2026-01-15'
        merchant_decision_maker_email:
          type: string
          format: email
          description: Merchant email (must be Business Admin in DoorDash Merchant Portal)
        order_protocol:
          type: string
          enum:
            - POS
            - TABLET
          description: >-
            POS - Merchant receives and fulfills orders via their POS; TABLET -
            Merchant will be sent a DD tablet and orders will not go to their
            POS
        fulfillment_protocol:
          type: string
          enum:
            - MERCHANT_PICK
            - DASHER_PICK
          description: >-
            MERCHANT_PICK - merchant picks; DASHER_PICK - dasher shops and
            delivers
        locale:
          type: string
          enum:
            - en-US
          description: Locale for the merchant onboarding experience
    MerchantAddress:
      type: object
      required:
        - line_1
        - city
        - state
        - zip
      properties:
        line_1:
          type: string
          description: Street address
        line_2:
          type: string
          description: Apartment, suite, etc.
        city:
          type: string
          description: City
        state:
          type: string
          description: State (2-letter code)
          pattern: ^[A-Z]{2}$
        zip:
          type: string
          description: ZIP/postal code
    ManagedMerchantConnectResponse:
      type: object
      properties:
        managed_merchant_connect_url:
          type: string
          format: uri
          description: >-
            Managed Merchant Onboarding URL. The partner must redirect the
            merchant to this URL where DoorDash hosts the full onboarding flow.
            After completion, DoorDash displays a confirmation page and the
            merchant should close the tab and return to the partner portal.
    MultiLocationOnboardingIntentRequest:
      type: object
      required:
        - requests
      properties:
        requests:
          type: array
          minItems: 1
          maxItems: 100
          description: >-
            One onboarding intent request per store location, submitted as a
            single batch
          items:
            $ref: '#/components/schemas/ManagedMerchantConnectRequest'
    MultiLocationOnboardingIntentResult:
      type: object
      properties:
        location_id:
          type: string
          description: Echoes the location_id from the corresponding request
        code:
          type: string
          description: >-
            gRPC status code name. "OK" means DoorDash accepted the onboarding
            intent for this location. No managed_merchant_connect_url is ever
            returned by this endpoint - onboarding completion for accepted
            locations is a manual follow-up.
          example: OK
        error:
          type: string
          description: Present only when code is not "OK"
    MultiLocationOnboardingIntentResponse:
      type: object
      properties:
        results:
          type: array
          description: >-
            One result per submitted location, positionally matching the request
            list and identifiable by location_id. Per-location business failures
            (e.g. invalid address) do not fail the whole batch.
          items:
            $ref: '#/components/schemas/MultiLocationOnboardingIntentResult'
    StoreAlreadyExistsError:
      x-error: true
      type: object
      description: Store with the provided partner_store_id is already onboarded
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - store_already_exists
          default: store_already_exists
        message:
          type: string
          example: Store with partner_store_id 'shopify_store_456' is already onboarded
    TaxInfo:
      type: object
      description: Tax information for line items or transaction
      properties:
        amount:
          type: number
          description: Tax amount in minor units of the specified currency
        tax_type:
          type: string
          description: Type of tax applied
          enum:
            - SALES_TAX
            - VAT
            - GST
            - EXCISE_TAX
            - TAX_ON_FEES
            - TAX_ON_SUBTOTAL
            - OTHER
        tax_type_other:
          type: string
          description: Additional details when tax_type is OTHER
    DiscountInfo:
      type: object
      description: Discount information for line items or transaction
      properties:
        amount:
          type: number
          description: Discount amount in minor units of the specified currency
        discount_type:
          type: string
          description: Type of discount applied
          enum:
            - MEMBER_SAVINGS
            - MX_PROMO
            - CPG_PROMO
            - OTHER
        discount_type_other:
          type: string
          description: Additional details when discount_type is OTHER
    FeeInfo:
      type: object
      description: Fee information for transaction
      properties:
        fee_amount:
          type: number
          description: Fee amount in minor units of the specified currency
        fee_type:
          type: string
          description: Type of fee applied
          enum:
            - ECO_FEE
            - BAG_FEE
            - BOTTLE_DEPOSIT_FEE
            - OTHER
        fee_type_other:
          type: string
          description: Additional details when fee_type is OTHER
    OtherIdentifier:
      type: object
      description: Additional identifiers for items
      properties:
        name:
          type: string
          description: Identifier name
        value:
          type: string
          description: Identifier value
    TransactionLineItem:
      type: object
      description: Individual line item in the transaction
      properties:
        line_id:
          type: string
          description: Unique identifier for the line item
        merchant_supplied_item_id:
          type: string
          description: Merchant supplied item identifier
        quantity:
          type: number
          description: Quantity of the item
        measurement_unit:
          type: string
          description: >-
            Unit of measurement for the item; accepted in either lower or upper
            case (e.g., 'ea' or 'EA')
          enum:
            - ea
            - kg
            - lb
            - gm
            - oz
        name:
          type: string
          description: Name of the item
        category:
          type: string
          description: Category of the item
        other_identifiers:
          type: array
          description: Other identifiers associated with the item
          items:
            $ref: '#/components/schemas/OtherIdentifier'
        scan_code:
          type: string
          description: Barcode or scan code for the item
        program_eligibility:
          type: array
          description: Program eligibility of the item
          items:
            $ref: '#/components/schemas/ProgramEligibility'
        price:
          type: number
          nullable: true
          description: >-
            Price per unit in minor units of the specified currency; null when
            the line item does not represent a priced unit (e.g.,
            variable-measure)
        net_price:
          type: number
          description: Total net price in minor units of the specified currency
        price_per_measurement_unit:
          type: number
          nullable: true
          description: >-
            Price per measurement unit in minor units of the specified currency;
            null when not applicable (e.g., line item is not measured-by-unit)
        net_price_per_measurement_unit:
          type: number
          description: >-
            Net price per measurement unit in minor units of the specified
            currency
        discounts:
          $ref: '#/components/schemas/DiscountInfo'
        taxes:
          type: array
          nullable: true
          description: >-
            Tax information for this line item; omit, use [], or null when not
            applicable
          items:
            $ref: '#/components/schemas/TaxInfo'
    TransactionSummary:
      type: object
      nullable: true
      description: >-
        Summary of transaction totals; the property may be omitted, sent as an
        empty object, or sent as null when not applicable
      properties:
        subtotal:
          type: number
          description: >-
            Subtotal amount in minor units of the specified currency before tax
            and fees
        tax:
          type: number
          description: Total tax amount in minor units of the specified currency
        fees:
          type: number
          description: Total fees amount in minor units of the specified currency
        discount:
          type: number
          description: Total discount amount in minor units of the specified currency
    CardTransactionInfo:
      type: object
      description: Card transaction information
      properties:
        bin:
          type: string
          description: Bank Identification Number (first 6 digits of card)
        card_holder_name:
          type: string
          description: Name of the card holder
        last_four_digits:
          type: string
          description: Last four digits of the card number
        card_type:
          type: string
          description: Type of card
          enum:
            - CREDIT
            - OTHER
        card_type_other:
          type: string
          description: Additional details when card_type is OTHER
        approval_code:
          type: string
          description: Authorization or approval code from the card network or processor
        card_transaction_status:
          type: string
          description: Status of the card transaction
    Tender:
      type: object
      description: >-
        Payment tender information. When tender_type is DOORDASH_DIRECT,
        doordash_direct_scan_code is populated with the scanned barcode or QR
        code value.
      required:
        - doordash_direct_scan_code
      properties:
        tender_type:
          type: string
          description: Type of tender used
          enum:
            - CARD
            - DOORDASH_DIRECT
            - HSA_FSA
            - SNAP
            - EBT
            - OTHER
        tender_type_other:
          type: string
          description: Additional details when tender_type is OTHER
        amount:
          type: number
          description: >-
            Amount paid with this tender in minor units of the specified
            currency
        card_info:
          $ref: '#/components/schemas/CardTransactionInfo'
        doordash_direct_scan_code:
          type: string
          description: Scanned barcode or QR code value when tender_type is DOORDASH_DIRECT
    Transaction:
      type: object
      title: Transaction
      description: Complete transaction with identifier, contents, and timestamp
      required:
        - merchant_supplied_transaction_id
        - in_store_transaction_contents
      properties:
        merchant_supplied_transaction_id:
          type: string
          description: Merchant supplied transaction identifier
        in_store_transaction_contents:
          $ref: '#/components/schemas/TransactionContent'
        marketplace_transaction_contents:
          $ref: '#/components/schemas/TransactionContent'
        transaction_timestamp:
          type: string
          format: date-time
          description: Timestamp when the transaction occurred in ISO8601 format
    BatchAddTransactionRequest:
      type: object
      description: Request to add multiple transactions
      properties:
        transactions:
          type: array
          description: List of transactions to add
          items:
            $ref: '#/components/schemas/Transaction'
    TransactionContent:
      type: object
      description: Transaction details without merchant-supplied transaction identifier
      required:
        - total
        - currency_code
      properties:
        total:
          type: number
          description: Total transaction amount in minor units of the specified currency
        currency_code:
          type: string
          description: Currency code for the transaction
          enum:
            - USD
            - AUD
        summary:
          $ref: '#/components/schemas/TransactionSummary'
        items:
          type: array
          description: List of line items in the transaction
          items:
            $ref: '#/components/schemas/TransactionLineItem'
        discounts:
          type: array
          description: Transaction-level discounts
          items:
            $ref: '#/components/schemas/DiscountInfo'
        taxes:
          type: array
          nullable: true
          description: Transaction-level taxes; omit, use [], or null when not applicable
          items:
            $ref: '#/components/schemas/TaxInfo'
        fees:
          type: array
          description: Transaction-level fees
          items:
            $ref: '#/components/schemas/FeeInfo'
        loyalty:
          type: object
          description: Loyalty information for transaction
          properties:
            member_info:
              $ref: '#/components/schemas/LoyaltyMemberInfo'
            points_awarded:
              type: number
              description: Points awarded from this transaction
        tenders:
          type: array
          minItems: 1
          maxItems: 1
          description: >-
            List of payment tenders used in this transaction. Exactly one tender
            must be provided per transaction; requests with zero or multiple
            tenders are rejected.
          items:
            $ref: '#/components/schemas/Tender'
    TransactionAuthRequest:
      type: object
      description: Request to authorize a transaction
      required:
        - dd_direct_scan_code
        - transaction_contents
      properties:
        checkout_id:
          type: string
          description: >-
            DoorDash checkout identifier (optional; authoritative checkout id is
            parsed from dd_direct_scan_code)
        client_txn_context_id:
          type: string
          description: >-
            Client-supplied context id for this transaction; server echoes it
            back in the response
        dd_direct_scan_code:
          type: string
          description: DoorDash Direct scan code for the transaction
        transaction_contents:
          $ref: '#/components/schemas/TransactionContent'
        client_request_time:
          type: string
          format: date-time
          description: Timestamp when the client initiated the request in ISO8601 format
    LoyaltyMemberInfo:
      type: object
      description: >-
        Loyalty member information. Mx can utilize this information to apply
        membership benefits.
      properties:
        member_id:
          type: string
          description: Loyalty member identifier
        scan_type:
          type: string
          description: Type of scan method used for loyalty
          enum:
            - QR_CODE
            - BARCODE
            - NA
        scan_payload:
          type: string
          description: Scanned loyalty payload value
    TransactionAuditResult:
      type: object
      description: Audit result for transaction authorization
      properties:
        reason_code:
          type: string
          description: Reason code for audit result
          enum:
            - INVALID_SCAN_CODE
            - CHECKOUT_NOT_ACTIVE
            - UNKNOWN_CHECKOUT_ID
            - OTHER
            - TRANSACTION_TOTAL_MISMATCH
        message:
          type: string
          description: Detailed message for the audit result
    TransactionAuthResponse:
      type: object
      title: TransactionAuthResponse
      description: Response for transaction authorization
      properties:
        client_txn_context_id:
          type: string
          description: >-
            Client-supplied context id for this transaction (echoed from
            request)
        order_uuid:
          type: string
          description: DoorDash order UUID
        delivery_uuid:
          type: string
          description: DoorDash delivery UUID
        approval_status:
          type: string
          description: Overall approval status of the transaction
          enum:
            - APPROVED
            - APPROVED_WITH_CONDITIONS
            - DENIED
        audit_results:
          type: array
          description: >-
            List of audit results explaining why the transaction was approved
            with conditions or denied; empty when approval_status is APPROVED
          items:
            $ref: '#/components/schemas/TransactionAuditResult'
    FieldError:
      title: FieldError
      type: object
      description: A field whose value couldn't be validated.
      required:
        - field
        - error
      properties:
        field:
          type: string
          description: Name of the field whose value couldn't be validated.
          example: pickup_phone_number
        error:
          type: string
          description: The error that was encountered when validating the field's value.
          example: Invalid phone number format
    ValidationFieldError:
      x-error: true
      title: ValidationFieldError
      type: object
      description: One or more request values couldn't be validated.
      required:
        - code
        - message
        - field_errors
      properties:
        code:
          type: string
          enum:
            - validation_error
        message:
          type: string
          description: One or more request values couldn't be validated.
          example: One or more request values couldn't be validated.
        field_errors:
          type: array
          description: >-
            The list of fields whose values couldn't be validated. See more
            [error
            examples](https://developer.doordash.com/en-US/docs/drive/reference/errors)
          items:
            $ref: '#/components/schemas/FieldError'
          nullable: false
          readOnly: true
    AuthenticationError:
      x-error: true
      type: object
      description: >-
        Authentication error: the token provided with the request doesn't work
        for the requested operation
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - authentication_error
          default: authentication_error
        message:
          type: string
          example: The [exp] is in the past; the JWT is expired
          default: The [exp] is in the past; the JWT is expired
    AuthorizationError:
      x-error: true
      type: object
      description: >-
        Authorization error: the credentials provided with the request don't
        work for the requested operation
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - authorization_error
          default: authorization_error
        message:
          type: string
          example: >-
            Authorization error: the credentials provided with the request don't
            work for the requested operation
          default: >-
            Authorization error: the credentials provided with the request don't
            work for the requested operation
    NotFoundError:
      x-error: true
      type: object
      description: Request entity was not found.
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - unknown_business_id
        message:
          type: string
          example: Entity was not found
    RequestNotProcessError:
      x-error: true
      type: object
      description: Request was not process.
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - request_rate_limited
        message:
          type: string
          example: Request was not process. Request entity may be too large.
    RequestRateLimitedError:
      x-error: true
      type: object
      description: Request was rate limited.
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - request_rate_limited
        message:
          type: string
          example: >-
            Request was rate limited. You may be calling the API too much in a
            short time.
    server_fault:
      x-error: true
      type: object
      description: Internal service failure, please try again later.
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - service_fault
          default: service_fault
        message:
          type: string
          example: Internal service failure, please try again later.
          default: Internal service failure, please try again later.
    StoreLocationNotFoundError:
      x-error: true
      type: object
      description: The store location could not be found.
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - unknown_store_location_id
        message:
          type: string
          example: The store location could not be found
    ConflictError:
      x-error: true
      type: object
      description: The checkout has already been authorized and cannot be authorized again.
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - checkout_already_authorized
        message:
          type: string
          example: >-
            The checkout has already been authorized and cannot be authorized
            again.
  requestBodies:
    BatchAddOrUpdateItem:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BatchAddOrUpdateItemRequest'
    BatchAddOrUpdateStoreItem:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BatchAddOrUpdateStoreItemRequest'
    BatchAddOrUpdatePromotion:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BatchAddOrUpdatePromotionRequest'
