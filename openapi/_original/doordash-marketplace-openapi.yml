openapi: 3.0.0
info:
  title: Marketplace API Specification
  x-logo:
    url: https://cdn.doordash.com/static/img/merchant/logo-red@3x.png
    backgroundColor: '#FFFFFF'
    altText: Doordash Marketplace
    href: https://developer.doordash.com/
  version: 1.0.0
  contact:
    name: Marketplace API Support
    url: https://openapi.doordash.com/marketplace
servers:
  - url: https://openapi.doordash.com/marketplace
tags:
  - name: Note
    x-displayName: Note
    description: >
      <div class="theme-admonition theme-admonition-note alert alert--secondary
      admonition_node_modules-@docusaurus-theme-classic-lib-theme-Admonition-styles-module">
        <div class="admonitionHeading_node_modules-@docusaurus-theme-classic-lib-theme-Admonition-styles-module">
          <span class="admonitionIcon_node_modules-@docusaurus-theme-classic-lib-theme-Admonition-styles-module">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="14"
              height="16"
              viewBox="0 0 14 16"
            >
              <path
                fill-rule="evenodd"
                d="M6.3 5.69a.942.942 0 0 1-.28-.7c0-.28.09-.52.28-.7.19-.18.42-.28.7-.28.28 0 .52.09.7.28.18.19.28.42.28.7 0 .28-.09.52-.28.7a1 1 0 0 1-.7.3c-.28 0-.52-.11-.7-.3zM8 7.99c-.02-.25-.11-.48-.31-.69-.2-.19-.42-.3-.69-.31H6c-.27.02-.48.13-.69.31-.2.2-.3.44-.31.69h1v3c.02.27.11.5.31.69.2.2.42.31.69.31h1c.27 0 .48-.11.69-.31.2-.19.3-.42.31-.69H8V7.98v.01zM7 2.3c-3.14 0-5.7 2.54-5.7 5.68 0 3.14 2.56 5.7 5.7 5.7s5.7-2.55 5.7-5.7c0-3.15-2.56-5.69-5.7-5.69v.01zM7 .98c3.86 0 7 3.14 7 7s-3.14 7-7 7-7-3.12-7-7 3.14-7 7-7z"
              ></path>
            </svg>
          </span>
          API Reference: Marketplace
        </div>
        <div class="admonitionContent_node_modules-@docusaurus-theme-classic-lib-theme-Admonition-styles-module">
          <p>
            This is the Marketplace API Reference page. If you're an existing customer
            using the Marketplace (legacy) API, see the
            <a href="/api/marketplace_legacy">Marketplace (legacy) API Reference</a>.
          </p>
          <br />
          <p>
            You can tell which API you're using by checking the URL. If your API URL
            is <code>https://openapi.doordash.com/marketplace</code>, you're using the
            Marketplace API.
          </p>
        </div>
      </div>
  - name: Caution
    x-displayName: Caution
    description: >
      <div class="theme-admonition theme-admonition-caution alert alert--warning
      admonition_node_modules-@docusaurus-theme-classic-lib-theme-Admonition-styles-module">
        <div class="admonitionHeading_node_modules-@docusaurus-theme-classic-lib-theme-Admonition-styles-module">
          <span class="admonitionIcon_node_modules-@docusaurus-theme-classic-lib-theme-Admonition-styles-module">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 16 16"
            >
              <path
                fill-rule="evenodd"
                d="M8.893 1.5c-.183-.31-.52-.5-.887-.5s-.703.19-.886.5L.138 13.499a.98.98 0 0 0 0 1.001c.193.31.53.501.886.501h13.964c.367 0 .704-.19.877-.5a1.03 1.03 0 0 0 .01-1.002L8.893 1.5zm.133 11.497H6.987v-2.003h2.039v2.003zm0-3.004H6.987V5.987h2.039v4.006z"
              ></path>
            </svg>
          </span>
          Caution
        </div>
        <div class="admonitionContent_node_modules-@docusaurus-theme-classic-lib-theme-Admonition-styles-module">
          <p>
            Our Marketplace integration pipeline is currently at capacity. Prospective
            partners can apply for API access directly through the DoorDash
            Developer Portal. New to the Developer Portal?
            <a
              href="https://identity.doordash.com/auth/user/signup?client_id=1709727354140907527&redirect_uri=https%3A%2F%2Fdeveloper.doordash.com%2Fauth_callback&scope=*&prompt=none&response_type=code&layout=drive_developer_portal&state=44377a4d-04db-4337-8b31-a381f3ca9110&allowRedirect=true&failureRedirect=%2Flogin&keepSessionInfo=true"
              target="_blank"
              rel="noopener noreferrer"
            >
              Sign up here
            </a>
            to create an account and apply for access. Already have a Developer
            Portal account?
            <a
              href="https://identity.doordash.com/auth?client_id=1709727354140907527&redirect_uri=https%3A%2F%2Fdeveloper.doordash.com%2Fauth_callback&scope=*&prompt=none&response_type=code&layout=drive_developer_portal&state=44377a4d-04db-4337-8b31-a381f3ca9110&allowRedirect=true&failureRedirect=%2Flogin&keepSessionInfo=true"
              target="_blank"
              rel="noopener noreferrer"
            >
              Log in
            </a>
            and submit your application from the Integrations tab{' '}
            <strong>before</strong> building your integration.
          </p>
        </div>
      </div>
  - name: Authentication
    x-displayName: Authentication
    description: See [JWT Token](/docs/marketplace/how_to/JWTs) guide
  - name: Menu Endpoints
    x-displayName: Menu Endpoints
    description: Endpoints for updating and creating menus
  - name: Order Endpoints
    x-displayName: Order Endpoints
    description: Endpoints for retrieving and confirming success of orders
  - name: Store Endpoints
    x-displayName: Store Endpoints
    description: Endpoints for store based operations
  - name: Models
    x-displayName: Models
    description: >
      ## StoreMenu

      <SchemaDefinition schemaRef="#/components/schemas/MenuCreateUpdateRequest"
      />


      ## Order

      <SchemaDefinition schemaRef="#/components/schemas/Order" />


      ## OrderCartValidation

      <SchemaDefinition schemaRef="#/components/schemas/OrderCartValidation" />


      ## MerchantOrderRecord

      <SchemaDefinition schemaRef="#/components/schemas/MerchantOrderRecord" />


      ## StoreConfirmOrderReadyForPickupRecord

      <SchemaDefinition
      schemaRef="#/components/schemas/StoreConfirmOrderReadyForPickupRecord" />


      ## ItemActivation

      <SchemaDefinition schemaRef="#/components/schemas/ItemActivation" />


      ## ItemOptionActivation

      <SchemaDefinition schemaRef="#/components/schemas/ItemOptionActivation" />


      ## StoreActivationStatus

      <SchemaDefinition schemaRef="#/components/schemas/StoreActivationStatus"
      />


      ## MxOrderAdjustRecord

      <SchemaDefinition schemaRef="#/components/schemas/MxOrderAdjustRecord" />
paths:
  /api/v1/menus:
    post:
      tags:
        - Menu Endpoints
      summary: Create Menu
      operationId: menuCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuCreateUpdateRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuCreateUpdateResponse'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '422':
          description: Request Entity Too Large
        '429':
          description: Request is rate limited
        '500':
          description: Internal Server Error
      x-codegen-request-body-name: body
  /api/v1/menus/{id}:
    patch:
      tags:
        - Menu Endpoints
      summary: Update Menu
      operationId: menuUpdate
      parameters:
        - $ref: '#/components/parameters/MenuId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuCreateUpdateRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuCreateUpdateResponse'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '422':
          description: Request Entity Too Large
        '429':
          description: Request is rate limited
        '500':
          description: Internal Server Error
      x-codegen-request-body-name: body
  /api/v1/orders/{id}:
    patch:
      tags:
        - Order Endpoints
      summary: Confirm Order
      description: Webhook to confirm an order
      operationId: confirmOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmOrderRequest'
        required: true
      responses:
        '202':
          description: OK
        '400':
          description: Order has already been processed or order has expired
        '401':
          description: Request is unauthenticated
        '403':
          description: Access is denied
        '404':
          description: Order with provided ID does not exist
        '429':
          description: Request is rate limited
        '500':
          description: Internal Server Error
      x-codegen-request-body-name: body
  /api/v1/orders/{id}/adjustment:
    patch:
      tags:
        - Order Endpoints
      summary: Cancel/Adjust/Substitute Items
      description: >-
        Endpoint for merchants to cancel items, adjust item/option quantities or
        substitute items
      operationId: adjustOrderItems
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustOrderItemRequest'
        required: true
      responses:
        '202':
          description: OK
        '400':
          description: Order is not confirmed or has been cancelled
        '404':
          description: Order, item, or option with provided ID does not exist
        '500':
          description: Internal Server Error
      x-codegen-request-body-name: body
  /api/v1/orders/{id}/cancellation:
    patch:
      tags:
        - Order Endpoints
      summary: Cancel Order
      description: Endpoint for merchants to cancel an order
      operationId: cancelOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
        required: true
      responses:
        '202':
          description: OK
        '400':
          description: Order is not confirmed or has already been cancelled
        '401':
          description: Request is unauthenticated
        '403':
          description: Access is denied
        '404':
          description: Order with provided ID does not exist
        '429':
          description: Request is rate limited
        '500':
          description: Internal Server Error
      x-codegen-request-body-name: body
  /api/v1/orders/{id}/return:
    post:
      tags:
        - Order Endpoints
      summary: Return Order [Retail Only]
      description: >-
        Endpoint for merchants to indicate an order has been returned (this is
        only for retail orders, not restaurant orders). To find out more, see
        https://developer.doordash.com/en-US/docs/marketplace/retail/orders/features/order_returns
      operationId: returnOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnOrderRequest'
        required: true
      responses:
        '202':
          description: Return request successfully received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnOrderResponse'
              example:
                operation_id: 8a718033-c12c-4d08-9376-0f4a96e4ac08
                operation_status: QUEUED
                message: Return request received.
        '400':
          description: >-
            Missing required fields, item does not belong to order or exists
            with less than requested return quantity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnOrderValidationErrorResponse'
              example:
                code: VALIDATION_ERROR
                message: One or more request values couldn't be validated.
                field_errors:
                  - field: return_items.quantity
                    error: item quantity must be greater than 0
        '401':
          description: Request is unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnOrderErrorResponse'
              example:
                code: UNAUTHENTICATED
                message: Request is unauthenticated
        '403':
          description: Access to the order or items is denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnOrderErrorResponse'
              example:
                code: NO_ACCESS
                message: Access to the order or items is denied
        '404':
          description: Order does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnOrderErrorResponse'
              example:
                code: NOT_FOUND
                message: Order does not exist
        '409':
          description: Duplicate refund request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnOrderErrorResponse'
              example:
                code: DUPLICATE_REQUEST
                message: All return items do not belong to the order
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnOrderErrorResponse'
              example:
                code: RATE_LIMIT_EXCEEDED
                message: Rate limit exceeded
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnOrderErrorResponse'
              example:
                code: INTERNAL_SERVER_ERROR
                message: Unexpected error occurred
      x-codegen-request-body-name: body
  /api/v1/orders/{id}/events/{event_type}:
    patch:
      tags:
        - Order Endpoints
      summary: Order Events
      description: >-
        Endpoint for order events. In order to use `patch_order_events`,
        separate token is required.
      operationId: storeConfirmOrderReadyForPickup
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/OrderEventType'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderEventsRequest'
        required: true
      responses:
        '202':
          description: OK
        '400':
          description: Order has expired
        '401':
          description: Request is unauthenticated
        '403':
          description: Access is denied
        '404':
          description: Order with provided ID does not exist
        '429':
          description: Request is rate limited
        '500':
          description: Internal Server Error
      x-codegen-request-body-name: body
  /api/v1/stores/{location_id}/store_details:
    get:
      tags:
        - Store Endpoints
      summary: Store Info
      description: Get the summary information of the given store
      operationId: getStoreInfo
      parameters:
        - $ref: '#/components/parameters/LocationId'
      responses:
        '200':
          description: Successfully retrieved store details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreInfoRequest'
        '400':
          description: Request contains invalid arguments
        '401':
          description: Request is unauthenticated
        '403':
          description: Access is denied
        '404':
          description: Store does not exist
        '429':
          description: Request is rate limited
        '500':
          description: Internal Server Error
      x-codegen-request-body-name: body
  /api/v1/stores/{location_id}/status:
    put:
      tags:
        - Store Endpoints
      summary: Activate/Deactivate Store
      operationId: updateStoreStatus
      parameters:
        - $ref: '#/components/parameters/LocationId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreStatusRequest'
        required: true
      responses:
        '200':
          description: Successfully updated store activation status
        '400':
          description: Request contains invalid arguments
        '401':
          description: Request is unauthenticated
        '403':
          description: Access is denied
        '404':
          description: Store does not exist
        '429':
          description: Request is rate limited
        '500':
          description: Internal Server Error
      x-codegen-request-body-name: body
  /api/v1/stores/{merchant_supplied_id}/item/availability:
    get:
      tags:
        - Store Endpoints
      summary: Get Item Availability
      description: Get the availability of a given item
      operationId: getItemAvailability
      parameters:
        - $ref: '#/components/parameters/MerchantSupplierIdItem'
      responses:
        '200':
          description: Successfully retrieved item availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemAvailability'
        '400':
          description: Request contains invalid arguments
        '401':
          description: Request is unauthenticated
        '403':
          description: Access is denied
        '404':
          description: Item does not exist
        '429':
          description: Request is rate limited
        '500':
          description: Internal Server Error
      x-codegen-request-body-name: body
  /api/v1/stores/{merchant_supplied_id}/item_option/availability:
    get:
      tags:
        - Store Endpoints
      summary: Get Item Option Availability
      description: Get the availability of a given item option
      operationId: getItemAvailability
      parameters:
        - $ref: '#/components/parameters/MerchantSupplierIdItemOption'
      responses:
        '200':
          description: Successfully retrieved item option availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemAvailability'
        '400':
          description: Request contains invalid arguments
        '401':
          description: Request is unauthenticated
        '403':
          description: Access is denied
        '404':
          description: Item option does not exist
        '429':
          description: Request is rate limited
        '500':
          description: Internal Server Error
      x-codegen-request-body-name: body
  /api/v1/stores/{merchant_supplied_id}/items/status:
    put:
      tags:
        - Store Endpoints
      summary: Activate/Deactivate Item
      description: Webhook to stock in/out items for a given store
      operationId: itemActivation
      parameters:
        - $ref: '#/components/parameters/MerchantSupplierId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemActivationDeactivationRequest'
        required: true
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '401':
          description: Request is unauthenticated
        '403':
          description: Not Allowed to modify this store
        '404':
          description: Store not found or all items within request not found
        '413':
          description: Request Entity Too Large
        '429':
          description: Request is rate limited
        '500':
          description: Internal Server Error
      x-codegen-request-body-name: body
  /api/v1/stores/{merchant_supplied_id}/item_options/status:
    put:
      tags:
        - Store Endpoints
      summary: Activate/Deactivate Item Options
      description: Webhook to stock in/out item options for a given store
      operationId: itemOptionActivation
      parameters:
        - $ref: '#/components/parameters/MerchantSupplierId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemOptionActivationDeactivationRequest'
        required: true
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '401':
          description: Request is unauthenticated
        '403':
          description: Not Allowed to modify this store
        '404':
          description: Store not found or all items within request not found
        '413':
          description: Request Entity Too Large
        '429':
          description: Request is rate limited
        '500':
          description: Internal Server Error
      x-codegen-request-body-name: body
  /api/v1/stores/{merchant_supplied_id}/menu_details:
    get:
      tags:
        - Store Endpoints
      summary: Get Store Menu Details
      description: Get the menu details of the given store
      operationId: getStoreMenuInfo
      parameters:
        - $ref: '#/components/parameters/MerchantSupplierId'
      responses:
        '200':
          description: Successfully retrieved store menu details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreMenuDetails'
        '400':
          description: Request contains invalid arguments
        '401':
          description: Request is unauthenticated
        '403':
          description: Access is denied
        '404':
          description: Store does not exist
        '429':
          description: Request is rate limited
        '500':
          description: Internal Server Error
      x-codegen-request-body-name: body
  /api/v1/stores/{merchant_supplied_id}/store_menu:
    get:
      tags:
        - Store Endpoints
      summary: Get Store Menu Jsons
      description: Get the menu jsons of the given store
      operationId: getStoreMenu
      security:
        - Authorization: []
      parameters:
        - $ref: '#/components/parameters/MerchantSupplierId'
      responses:
        '200':
          description: Successfully retrieved store menu jsons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuCreateUpdateRequest'
        '400':
          description: Request contains invalid arguments
        '401':
          description: Request is unauthenticated
        '403':
          description: Access is denied
        '404':
          description: Store does not exist
        '429':
          description: Request is rate limited
        '500':
          description: Internal Server Error
      x-codegen-request-body-name: body
components:
  parameters:
    MenuId:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: A Menu UUID
    OrderId:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: Order ID
    OrderEventType:
      in: path
      name: event_type
      required: true
      schema:
        type: string
      description: 'Supported event types: `order_ready_for_pickup`'
    MerchantSupplierId:
      in: path
      name: merchant_supplied_id
      required: true
      schema:
        type: string
      description: Store location id
    MerchantSupplierIdItem:
      in: path
      name: merchant_supplied_id
      required: true
      schema:
        type: string
      description: Item ID in your system
    MerchantSupplierIdItemOption:
      in: path
      name: merchant_supplied_id
      required: true
      schema:
        type: string
      description: Item Option ID in your system
    LocationId:
      in: path
      name: location_id
      required: true
      schema:
        type: string
      description: Store location id
  schemas:
    StoreMenuDetails:
      type: object
      properties:
        provider_name:
          type: string
          description: Provider name
          example: square
        merchant_supplied_id:
          type: string
          description: Partner specified ID for the store
          example: 1dfa934a-190c-43a9-b2e0-449e5b8cccde
        menu:
          type: array
          description: Active menus
          items:
            $ref: '#/components/schemas/MenuDetails'
    MenuDetails:
      type: object
      properties:
        menu_id:
          type: string
          description: Menu identifier
        name:
          type: string
          description: Menu name
        subtitle:
          type: string
          description: Menu subtitle
        is_active:
          type: boolean
          description: Menu is active
        is_pos_menu:
          type: boolean
          description: Menu was created via POS
        latest_menu_update:
          type: object
          description: Latest menu update
          properties:
            created_at:
              type: string
              format: date-time
              description: Time of latest menu update
            status:
              type: string
              enum:
                - PENDING
                - SUCCESS
                - FAILURE
              description: Status of latest menu update
        last_successful_menu_update_at:
          type: string
          format: date-time
          description: Time of last successful menu update
        url:
          type: string
          description: Menu preview URL
        open_hours:
          type: array
          description: Menu hours
          items:
            $ref: '#/components/schemas/StoreOpenHour'
        special_hours:
          type: array
          description: Menu special hours
          items:
            $ref: '#/components/schemas/StoreSpecialHour'
    ItemAvailability:
      type: object
      properties:
        merchant_supplied_id:
          type: string
        is_active:
          type: boolean
        start_time:
          type: string
          description: Start time in format YYYY-MM-DD HH:MM:SS.
          example: YYYY-MM-DD HH:MM:SS
        end_time:
          type: string
          description: End time in format YYYY-MM-DD HH:MM:SS.
          example: YYYY-MM-DD HH:MM:SS
    ItemUpdate:
      type: object
      required:
        - is_suspended
      properties:
        merchant_supplied_id:
          type: string
        is_suspended:
          type: boolean
        price:
          type: integer
    ItemActivationDeactivationRequest:
      type: array
      items:
        $ref: '#/components/schemas/ItemActivation'
    ItemOptionActivationDeactivationRequest:
      type: array
      items:
        $ref: '#/components/schemas/ItemActivation'
    ItemActivation:
      type: object
      required:
        - merchant_supplied_id
        - is_active
      properties:
        merchant_supplied_id:
          type: string
        is_active:
          type: boolean
    ItemOptionActivation:
      type: object
      required:
        - merchant_supplied_id
        - is_active
      properties:
        merchant_supplied_id:
          type: string
