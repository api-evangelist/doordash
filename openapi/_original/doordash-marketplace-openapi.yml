    OrderConfirmationError:
      type: object
      required:
        - code
        - merchant_supplied_id
        - message
      properties:
        code:
          type: string
          description: >
            Standardized error code indicating the reason for order failure.
            `REQUESTED_SLOT_UNAVAILABLE` — the requested pickup slot is
            unavailable but alternatives exist; respond with a
            `CAPACITY_THROTTLING` error and the earliest available pickup time.
            `NO_SLOTS_AVAILABLE` — no pickup capacity is available for the
            entire day; respond with this code and a null pickup time.
          enum:
            - INVALID_ORDER
            - ITEM_OUT_OF_STOCK
            - STORE_HOURS_ISSUE
            - INTERNAL_ERROR
            - OTHER
            - CONNECTIVITY_ISSUE
            - TIME_OUT
            - STORE_CLOSED
            - STORE_CLOSED_EARLY
            - POS_OFFLINE
            - CAPACITY_THROTTLING
            - STALE_PICKUP_TIME
            - ORDER_ONLINE_DISABLED
            - INVALID_ADDRESS
            - STORE_RENOVATION
            - STORE_TEMP_CLOSED
            - WEATHER_ISSUES
            - REQUESTED_SLOT_UNAVAILABLE
            - NO_SLOTS_AVAILABLE
          example: ITEM_OUT_OF_STOCK
        merchant_supplied_id:
          type: string
          description: >-
            The merchant_supplied_id of the specific item or modifier associated
            with this error.
          example: item_salad_plate
        message:
          type: string
          description: A human-readable message describing the issue.
          example: Salad Plate is currently unavailable
