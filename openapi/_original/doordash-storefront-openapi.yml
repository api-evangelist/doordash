        id:
          type: string
          description: The id of this instance
        min_num_options:
          description: Minimum number of total options that must be selected
          type: integer
        max_num_options:
          description: Maximum number of total options that must be selected
          type: integer
        num_free_options:
          description: Maximum number of options that are free
          type: integer
        min_option_choice_quantity:
          description: Minimum quantity of a single option that must be selected
          type: integer
        max_option_choice_quantity:
          description: Maximum quantity of a single option that can be selected
          type: integer
        min_aggregate_options_quantity:
          description: Minimum combined quantity of all options that must be selected
          type: integer
        max_aggregate_options_quantity:
          description: Maximum combined quantity of all options that can be selected
          type: integer
        options:
          type: array
          items:
            $ref: '#/components/schemas/NestedL2ItemExtraOption'
