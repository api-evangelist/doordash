components:
  parameters:
    Language:
      name: language
      in: query
      description: ISO 639-1 language code
      schema:
        $ref: '#/components/schemas/Language'
    CountryCode:
      name: country_code
      in: query
      description: ISO 3166-1 alpha-2 country code
      schema:
        $ref: '#/components/schemas/CountryCode'
    ProviderReferenceId:
      name: provider_reference_id
      in: query
      description: >-
        merchant id or any other id which loyalty provider uses to uniquely
        identify the business/merchant.
      required: true
      schema:
        $ref: '#/components/schemas/ProviderReferenceId'
    Code:
      name: code
      in: query
      description: code to get user's information on their behalf
      required: true
      schema:
        $ref: '#/components/schemas/Code'
    ProviderEnvironment:
      name: provider_environment
      in: query
      description: which environment of the loyalty provider needs to be used.
      required: true
      schema:
        $ref: '#/components/schemas/ProviderEnvironment'
    AppPlatform:
      name: app_platform
      in: query
      description: operating system like android or ios.
      required: true
      schema:
        $ref: '#/components/schemas/AppPlatform'
    Provider:
      name: provider
      in: query
      description: loyalty provider of the user
      required: true
      schema:
        $ref: '#/components/schemas/Provider'
    ExternalUserId:
      name: external_user_id
      in: query
      description: External User id, user identifier of the external loyalty provider
      required: true
      schema:
        $ref: '#/components/schemas/ExternalUserId'
    IntegrationId:
      name: integration_id
      in: query
      description: business id, business group id or store id
      required: true
      schema:
        $ref: '#/components/schemas/IntegrationId'
    OptionalIntegrationId:
      name: integration_id
      in: query
      description: business id, business group id or store id
      schema:
        $ref: '#/components/schemas/IntegrationId'
    IntegrationType:
      name: integration_type
      in: query
      description: business id, business group id or store id
      schema:
        $ref: '#/components/schemas/IntegrationType'
    ConsumerId:
      name: consumer_id
      in: query
      description: Consumer id
      required: true
      schema:
        $ref: '#/components/schemas/ConsumerId'
    StoreId:
      name: store_id
      in: path
      description: Store id
      required: true
      schema:
        $ref: '#/components/schemas/StoreId'
    BusinessId:
      name: business_id
      in: path
      description: Business id used for filtering stores
      required: true
      schema:
        $ref: '#/components/schemas/BusinessId'
    BusinessGroupId:
      name: business_group_id
      in: path
      description: Business group id used for filtering stores
      required: true
      schema:
        $ref: '#/components/schemas/BusinessGroupId'
    Latitude:
      name: lat
      in: query
      description: latitude
      required: true
      schema:
        $ref: '#/components/schemas/Latitude'
    Longitude:
      name: lon
      in: query
      description: longitude
      required: true
      schema:
        $ref: '#/components/schemas/Longitude'
    PaginationToken:
      name: pagination_token
      in: query
      description: The pagination token to retrieve the previous/next page of results.
      schema:
        $ref: '#/components/schemas/PaginationToken'
    NextToken:
      name: next_token
      in: query
      description: The pagination token to retrieve the next page of results.
      schema:
        $ref: '#/components/schemas/PaginationToken'
    Limit:
      name: limit
      in: query
      description: >-
        Specify the maximum number of items that may be returned for a single
        request.
      schema:
        $ref: '#/components/schemas/Limit'
    OpenAt:
      name: open_at
      in: query
      description: >-
        If specified, only stores that are open for business at the specified
        time are returned. Possible values is future UTC timestamp in ISO-8601
        format within seven days from current time.
      schema:
        $ref: '#/components/schemas/OpenAt'
    IsPickup:
      name: is_pickup
      in: query
      description: >-
        If true, return stores based on store pick up radius. Otherwise, return
        stores based on delivery radius. The default value is true.
      schema:
        $ref: '#/components/schemas/IsPickup'
    ShouldSendStoreDetails:
      name: should_send_store_details
      in: query
      description: >-
        If true, return stores details for each store in the list. The default
        value is false.
      schema:
        $ref: '#/components/schemas/ShouldSendStoreDetails'
    SearchRadius:
      name: search_radius
      in: query
      description: >-
        Define the distance in meters within which to return store results. The
        default value is 1000. Search radius is only applicable to pick ups.
      schema:
        $ref: '#/components/schemas/StoreRadius'
  schemas:
    Language:
      type: string
      pattern: ^[a-z]{2}$
      description: Language code in ISO 639-1 format
      example: en
    CountryCode:
      type: string
      pattern: ^[A-Z]{2}$
      description: Country code in ISO 3166-1 alpha-2 format
      example: US
    OrderStatus:
      type: string
      enum:
        - unspecified
        - order_placed
        - delivery_created
        - order_completed
        - order_cancelled
        - store_confirmed_order
        - store_confirmed_ready_for_pickup
        - dasher_confirmed_assignment
        - dasher_arriving_at_store
        - dasher_confirmed_at_store
        - dasher_arriving_at_consumer
        - dasher_confirmed_at_consumer
        - order_picked_up
      example: order_placed
    CreatedAt:
      type: string
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(.[0-9]{3,})?Z$
      description: UTC Timestamp in ISO-8601 format
      example: 2018-08-22T17:20:28Z or 2018-08-22T17:20:28.123Z
    UpdatedAt:
      type: string
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(.[0-9]{3,})?Z$
      description: UTC Timestamp in ISO-8601 format
      example: 2018-08-22T17:20:28Z or 2018-08-22T17:20:28.123Z
    ProviderReferenceId:
      type: string
      pattern: ^([a-zA-Z1-9][:_a-zA-Z0-9]*)$
      description: Unique ID for a external user.
      example: '123:12'
    Code:
      type: string
      description: >-
        code which the user has received from the provider to get their
        information.
      example: wewe023kwewo0
    ProviderEnvironment:
      type: string
      enum:
        - prod
        - staging
      example: staging
      description: which provider environment user has logged in to.
    SessionId:
      type: string
      description: id of the application session
    CartId:
      type: string
      description: id of the cart.
    GetLoyaltyInfo:
      type: boolean
      description: if true, return loyalty account information for the user.
      default: false
    AppPlatform:
      type: string
      enum:
        - android
        - ios
      example: android
      description: operating system of the application.
    Provider:
      type: string
      enum:
        - paytronix
        - spendgo
      example: spendgo
      description: which provider the user has logged in to
    ExternalUserId:
      type: string
      pattern: ^([a-zA-Z1-9][a-zA-Z0-9]*)$
      description: Unique ID for a external user.
      example: asAZ123
    ConsumerId:
      type: string
      pattern: ^([1-9][0-9]*)$
      description: Unique ID for a doordash consumer.
      example: '123'
    QRCodeEnabled:
      type: boolean
      description: if true, return then the mx is enabled show qr code option.
      default: false
    QRCode:
      type: string
      description: base 64 encoded QR code for user's account.
    Width:
      type: integer
      description: expected width of the qr code
      example: 300
      default: 256
      minimum: 1
      maximum: 1024
    Height:
      type: integer
      description: expected height of the qr code
      example: 300
      default: 256
      minimum: 1
      maximum: 1024
    IntegrationId:
      type: string
      pattern: ^([1-9][0-9]*)$
      description: Unique ID for the business, business group or store.
      example: '987654'
    IntegrationType:
      type: string
      enum:
        - BUSINESS
        - BUSINESS_GROUP
        - STORE
      example: store
      default: business
      description: Type of the integration id
    SupportedAccountType:
      type: string
      enum:
        - SF_ACCOUNT
        - SF_ACCOUNT_LOYALTY
        - EXTERNAL_ACCOUNT
      example: SF_ACCOUNT
      description: what kind of account it is for logged in user.
    GenerateStorefrontUserQrCodeRequest:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/LoyaltyUserSessionRequest'
        store_id:
          $ref: '#/components/schemas/StoreId'
        width:
          $ref: '#/components/schemas/Width'
        height:
          $ref: '#/components/schemas/Height'
      required:
        - session
        - store_id
    GenerateStorefrontUserQrCodeResponse:
      type: object
      properties:
        qr_code:
          $ref: '#/components/schemas/QRCode'
      required:
        - qr_code
    LoyaltyRetrieveRewardsRequest:
      type: object
      properties:
        integration_id:
          $ref: '#/components/schemas/IntegrationId'
        integration_type:
          $ref: '#/components/schemas/IntegrationType'
        session_id:
          $ref: '#/components/schemas/SessionId'
        store_id:
          $ref: '#/components/schemas/StoreId'
      required:
        - session_id
        - store_id
        - integration_id
        - integration_type
    LoyaltyCheckInRequest:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/LoyaltyUserSessionRequest'
        store_id:
          $ref: '#/components/schemas/StoreId'
        latitude:
          $ref: '#/components/schemas/Latitude'
        longitude:
          $ref: '#/components/schemas/Longitude'
      required:
        - session
        - store_id
    LoyaltyCheckInResponse:
      type: object
      properties:
        earned_reward:
          $ref: '#/components/schemas/Reward'
    LoyaltyRedeemRewardRequest:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/LoyaltyUserSessionRequest'
        promotion_id:
          type: string
          description: Unique identifier for the reward
          example: 2d3eddf8-2723-434d-81d5-920eac66a61c
      required:
        - session
        - promotion_id
    LoyaltyRedeemRewardResponse:
      type: object
      properties:
        applied_redemption:
          type: array
          items:
            $ref: '#/components/schemas/Redemption'
        rejected_redemption:
          type: array
          items:
            $ref: '#/components/schemas/Redemption'
    LoyaltyUserSessionRequest:
      type: object
      properties:
        session_id:
          $ref: '#/components/schemas/SessionId'
        integration_id:
          $ref: '#/components/schemas/IntegrationId'
        integration_type:
          $ref: '#/components/schemas/IntegrationType'
      required:
        - session_id
        - integration_id
        - integration_type
    LoyaltyMemberProfileRequest:
      type: object
      properties:
        session_id:
          $ref: '#/components/schemas/SessionId'
        integration_id:
          $ref: '#/components/schemas/IntegrationId'
        integration_type:
          $ref: '#/components/schemas/IntegrationType'
        get_loyalty_info:
          $ref: '#/components/schemas/GetLoyaltyInfo'
      required:
        - session_id
        - integration_id
        - integration_type
    LoyaltyMemberProfileResponse:
      type: object
      title: LoyaltyMemberProfileResponse
      description: Loyalty member profile
      required:
        - profile
      properties:
        profile:
          $ref: '#/components/schemas/LoyaltyMemberProfile'
    LoyaltyMemberProfile:
      type: object
      properties:
        external_user_id:
          type: string
          description: Member id with the loyalty provider
          example: '123'
        first_name:
          type: string
          description: First name
          example: John
        last_name:
          type: string
          description: Last name
          example: Doe
        email:
          type: string
          description: Email
          example: john.doe@email.com
        phone_number:
          type: string
          description: Phone number
          example: '1234567890'
        loyalty_points:
          type: integer
          description: Balance of loyalty points
          example: 100
        loyalty_tier:
          type: string
          description: Loyalty tier
          example: Gold
        in_store_rewards:
          $ref: '#/components/schemas/InStoreRewards'
    InStoreRewards:
      type: object
      properties:
        rewards_progress:
          $ref: '#/components/schemas/RewardsProgress'
        available_rewards:
          type: array
          items:
            $ref: '#/components/schemas/Rewards'
        unavailable_rewards:
          type: array
          items:
            $ref: '#/components/schemas/Reward'
        activated_rewards:
          type: array
          items:
            $ref: '#/components/schemas/Reward'
        past_rewards:
          type: array
          items:
            $ref: '#/components/schemas/Reward'
        card_linking_payment_methods:
          type: array
          items:
            $ref: '#/components/schemas/CardLinkingPaymentMethod'
    RewardsProgress:
      type: object
      properties:
        title:
          type: string
          description: Title describing rewards progress
          example: 2 orders away from your next reward
        subtitle:
          type: string
          description: Optional subtitle describing rewards progress
          example: Earn $5 for every 5 orders
        current_points:
          type: integer
          description: Balance of loyalty points
          example: 5
        target_points:
          type: integer
          description: Loyalty points needed to earn the next reward
          example: 10
    Reward:
      type: object
      properties:
        reward_id:
          type: string
          description: Unique identifier for the reward
          example: 2d3eddf8-2723-434d-81d5-920eac66a61c
        name:
          type: string
          description: User facing description of the reward
          example: $5 off your order
        description:
          type: string
          description: Used to provide any additional description about the reward
          example: No minimum spend
        redemption:
          $ref: '#/components/schemas/Redemption'
    Rewards:
      type: array
      items:
        $ref: '#/components/schemas/Redemption'
    Redemption:
      type: object
      properties:
        reward_id:
          type: string
          description: Unique identifier for the reward
          example: 2d3eddf8-2723-434d-81d5-920eac66a61c
        redeemed:
          type: boolean
          description: Whether or not the redemption has taken place
          example: true
        message:
          type: string
          description: A message to show the user describing the redemption
          example: $5 reward
        description:
          type: string
          description: A confirmation message to show the user when redeeming a reward
          example: You have two hours to redeem your reward in-store before it expires.
        redemption_time:
          type: string
          pattern: >-
            ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(.[0-9]{3,})?Z$
          description: UTC Timestamp in ISO-8601 format
          example: '2018-08-22T17:20:28Z'
        expiration_time:
          type: string
          pattern: >-
            ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(.[0-9]{3,})?Z$
          description: UTC Timestamp in ISO-8601 format
          example: '2018-08-22T17:20:28Z'
