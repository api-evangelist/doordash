components:
  schemas:
    CreateBusinessInput:
      title: CreateBusinessInput
      type: object
      properties:
        external_business_id:
          $ref: '#/components/schemas/BizExternalBusinessId'
        name:
          $ref: '#/components/schemas/BusinessName'
        description:
          $ref: '#/components/schemas/BusinessDescription'
        activation_status:
          $ref: '#/components/schemas/BusinessActivationStatus'
      required:
      - name
      - external_business_id
    Name:
      title: Store Name
      type: string
      pattern: Any non empty string
      description: The name of the store.
      example: 'Neighborhood Deli #10'
    BusinessDescription:
      type: string
      pattern: Any non empty string
      description: Short description of the business. Used in the DoorDash Merchant Portal. Maximum length of description is 100 characters
      example: A neighborhood deli serving many tasty sandwiches and soups.
    BusinessName:
      title: Business Name
      type: string
      pattern: Any non empty string
      description: Human readable name for the business. Used when the details of a business are shown to a customer, Dasher, merchant, or support agent.
      example: Neighborhood Deli
    server_fault:
      x-error: true
      type: object
      description: Internal service failure, please try again later.
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - service_fault
          default: service_fault
        message:
          type: string
          example: Internal service failure, please try again later.
          default: Internal service failure, please try again later.
    authorization_error:
      x-error: true
      type: object
      description: 'Authorization error: the credentials provided with the request don''t work for the requested operation'
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - authorization_error
          default: authorization_error
        message:
          type: string
          example: 'Authorization error: the credentials provided with the request don''t work for the requested operation'
          default: 'Authorization error: the credentials provided with the request don''t work for the requested operation'
    FieldError:
      title: FieldError
      type: object
      description: A field whose value couldn't be validated.
      required:
      - field
      - error
      properties:
        field:
          type: string
          description: Name of the field whose value couldn't be validated.
          example: pickup_phone_number
        error:
          type: string
          description: The error that was encountered when validating the field's value.
          example: Invalid phone number format
    UpdateStoreInput:
      title: UpdateStoreInput
      type: object
      properties:
        name:
          $ref: '#/components/schemas/Name'
        phone_number:
          $ref: '#/components/schemas/StorePhoneNumber'
        address:
          $ref: '#/components/schemas/StoreAddress'
    PaginatedStoreList:
      type: object
      required:
      - store_list
      - result_count
      properties:
        result:
          type: array
          items:
            $ref: '#/components/schemas/Store'
          description: Max length of result set is 25
        continuation_token:
          type: string
          description: Opaque string that can be used to fetch next page of stores, the token value will be null if there are no more stores to fetch.
        result_count:
          type: integer
    MissingDependency:
      title: MissingDependency
      type: object
      description: Missing dependencies.
      required:
      - dependency
      - error
      properties:
        field:
          type: string
          description: identifier for dependency
          example: invocing
        error:
          type: string
          description: Error string description missing dependency
          example: Missing invocing set up
    StoreExternalBusinessId:
      type: string
      pattern: /^[A-Za-z0-9_-]{3,64}$/
      description: Unique, caller-selected ID for the business.
      example: a0720d55-7cbe-41ce-8185-58285b7985cd
    ExternalMetadata:
      title: ExternalMetadata
      description: Additional caller-specific metadata about the business. Used primarily for the automatic self-serve onboarding flow.
      type: object
      properties:
        number_of_stores:
          type: integer
          description: Number of stores owned by the business.
          example: '10'
        client_email:
          type: string
          description: Business owner or contact email address.
          example: merchant@doordash.com
        client_phone_number:
          type: string
          description: Business owner or contact phone number.
          example: '+12065551212'
        external_store_ids:
          type: array
          items:
            type: String
          description: External store_ids that merchant wants MWP/DoorDash to create stores
    validation_field_error:
      x-error: true
      title: ValidationFieldError
      type: object
      description: One or more request values couldn't be validated.
      required:
      - code
      - message
      - field_errors
      properties:
        code:
          type: string
          enum:
          - validation_error
        message:
          type: string
          description: One or more request values couldn't be validated.
          example: One or more request values couldn't be validated.
        field_errors:
          type: array
          description: The list of fields whose values couldn't be validated. See more [error examples](https://developer.doordash.com/en-US/docs/drive/reference/errors)
          items:
            $ref: '#/components/schemas/FieldError'
          readOnly: true
      components:
        schemas:
          FieldError:
            title: FieldError
            type: object
            description: A field whose value couldn't be validated.
            required:
            - field
            - error
            properties:
              field:
                type: string
                description: Name of the field whose value couldn't be validated.
                example: pickup_phone_number
              error:
                type: string
                description: The error that was encountered when validating the field's value.
                example: Invalid phone number format
    BusinessActivationStatus:
      type: string
      description: Activation status of the business. Used primarily for the automatic self-serve onboarding flow.
      enum:
      - initiated
      - pending_external_activation
      - pending_legal_agreement
      - abandoned
      - failed
      - active
      - inactive
      example: active
    UpdateBusinessInput:
      title: UpdateBusinessInput
      type: object
      properties:
        name:
          $ref: '#/components/schemas/BusinessName'
        description:
          $ref: '#/components/schemas/BusinessDescription'
        activation_status:
