      type: object
      properties:
        order_value:
          $ref: '#/components/schemas/OrderValue'
        currency:
          $ref: '#/components/schemas/Currency'
    DropoffAddressComponents_CA:
      type: object
      title: Canada
      description: Drop-off Address broken down by components for CA
      properties:
        street_address:
          type:
          - string
          - 'null'
          description: The street address of the drop-off location. If you have multiple lines, concatenate them with a comma
          example: 358 Industry Drive
        sub_premise:
          type:
          - string
          - 'null'
          description: Used to denote the unit number, suite number or apartment number
          example: Apt. 121
        city:
          type:
          - string
          - 'null'
          description: City for the address
          example: Toronto
        province:
          type:
          - string
          - 'null'
          description: Province for the address. 2 letter province codes for Canadian addresses. For instance, “ON” for Ontario
          example: 'ON'
        postal_code:
          type:
          - string
          - 'null'
          description: Postal code for the address
          example: M4C-1V7
        country:
          type:
          - string
          - 'null'
          description: Country needs to be passed as an ISO 3166 Alpha 2 code. If it is not a valid ISO ALPHA 2 code, you would receive a validation error. “CA” for Canada
          example: CA
    DropoffAddress_2:
      type: string
      description: Comma-separated full address, in the order appropriate for your locale.
      example: 901 Market Street 6th Floor San Francisco, CA 94103
    UpdateDeliveryInputOnlyOptions:
      title: UpdateDeliveryInputOnlyOptions
      description: Fields accepted only on the update-delivery (PATCH) request.
      type: object
      properties:
        order_ready_time:
          type: string
          description: The UTC time at which the order was actually ready at the pickup location.
          example: '2018-08-22T17:20:28Z'
    DropoffAddressComponents_AU:
      type: object
      title: Australia
      description: Drop-off Address broken down by components for AU
      properties:
        street_address:
          type:
          - string
          - 'null'
          description: The street number and address of the drop-off location. If you have multiple lines, concatenate them with a comma. Do not include the unit number or slashes in the street address. Please pass them in the sub_premise field. For example, if the address is 21/17 Jones St, pass 17 Jones St
          example: 17 Jones St
        sub_premise:
          type:
          - string
          - 'null'
          description: Used to denote the unit number, flat number, suite number, or apartment number
          example: Apt. 121
        locality:
          type:
          - string
          - 'null'
          description: Delivery suburb / town for the address
          example: North Sydney
        territory:
          type:
          - string
          - 'null'
          description: State code for the address. Use the state abbreviation. For instance NSW for New South Wales, VIC for Victoria, etc.
          example: NSW
        postal_code:
          type:
          - string
          - 'null'
          description: Postal code for the address
          example: 2060
        country:
          type:
          - string
          - 'null'
          description: Country needs to be passed as an ISO 3166 Alpha 2 code. If it is not a valid ISO ALPHA 2 code, you would receive a validation error. “AU” for Australia
          example: AU
    authorization_error:
      x-error: true
      type: object
      description: 'Authorization error: the credentials provided with the request don''t work for the requested operation'
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - authorization_error
          default: authorization_error
        message:
          type: string
          example: 'Authorization error: the credentials provided with the request don''t work for the requested operation'
          default: 'Authorization error: the credentials provided with the request don''t work for the requested operation'
    ReturnPinCodeType:
      type: string
      description: An enum that specifies the pin code value type. The values that can be specified are 'merchant_provided_number' (pin code for return verification is the merchant provided 4 digit number), 'random_number' (pin code for return verification is the random 4 digit number generated by DD).
      enum:
      - random_number
      - merchant_provided_number
      example: merchant_provided_number
    DeliveryValueInputDetails:
      title: DeliveryValueInputDetails
      description: Delivery value input details.
      type: object
      properties:
        order_value:
          $ref: '#/components/schemas/OrderValue'
    DeliveryItemsDetails:
      title: DeliveryItemsDetails
      description: Details about the individual items included in the order.
      type: object
      properties:
        items:
          type: array
          description: The items included in the order.
          items:
            $ref: '#/components/schemas/DeliveryItem'
    OrderRouteItems:
      type: array
      items:
        $ref: '#/components/schemas/OrderRouteItem'
        example:
        - check
    PaymentGiftCards:
      type: array
      description: List of gift cards use for payment
      items:
        PaymentGiftCard:
          type: string
      example:
      - '123443434'
      - '123443435'
    DeliveryItemsForSubsRecommendationResponse:
      title: DeliveryItemsForSubsRecommendationResponse
      description: Details about the items in the substitution recommendation.
      type: object
      properties:
        items:
          type: array
          description: The items included in the response.
          items:
            $ref: '#/components/schemas/DeliveryItemDetailsForSubsRecommendation'
    OrderValue:
      minimum: 0
      type: integer
      description: The subtotal for all items in the order, excluding tax/tip, in the lowest currency denomination (e.g. cents). i.e. $19.99 = 1999.
      format: int32
      example: 1999
    PaymentBarcode:
      type: string
      description: The token that will be scanned as a barcode at checkout lane as payment for the order in store.
      example: '12345'
    Tobacco:
      type: boolean
      description: Flag to specify if the delivery contains tobacco items.
      example: false
    TimeWindow:
      title: TimeWindowDetails
      description: The UTC date-time (in ISO-8601 format) overrides dropoff_time and pickup_time when all four parameters of the time window (pickup_window_start_time , pickup_window_end_time , dropoff_window_start_time , dropoff_window_end_time) are provided.
      type: object
      properties:
        start_time:
          $ref: '#/components/schemas/Time'
        end_time:
          $ref: '#/components/schemas/Time'
    ExternalStoreId:
      type: string
      description: 'The string identifier used to create your store. If you provide an pickup_external_store_id, you must also provide an pickup_external_business_id. If you provide an pickup_external_store_id, the address of the store will override the pickup_address in the request. Some examples would look like this: "ase-243-dzs", "09", "#00012"'
      example: ase-243-dzs
    OTC:
      type: boolean
      description: Flag to specify if the delivery contains otc items.
      example: false
    SubstituteItemMetadata:
      title: SubstituteItemMetadata
      description: Metadata for the substitute item.
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the substitute item
        quantity:
          type: integer
          description: Quantity of the substitute item
        weight:
          type: number
          format: double
          description: Unit weight of 1 instance of this item, with or without a decimal point. The overall weight of this item is calculated by multiplying this field by quantity.
          minimum: 0
          maximum: 999.9995
        weight_unit:
          type: string
          description: Weight unit of the substitute item
          enum:
          - oz
          - lbs
          - kg
          - g
      required:
      - id
      - quantity
    authentication_error:
      x-error: true
      type: object
      description: 'Authentication error: the token provided with the request doesn''t work for the requested operation'
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - authentication_error
          default: authentication_error
        message:
          type: string
          example: The [exp] is in the past; the JWT is expired
          default: The [exp] is in the past; the JWT is expired
    DasherDetails:
      title: DasherDetails
      description: Details about the Dasher assigned to this delivery. Details will be provided once a Dasher has been assigned and has accepted the delivery.
      type: object
      properties:
        dasher_id:
          type: integer
          format: int32
          description: Unique identifier for the Dasher.
          example: 1232142
        dasher_name:
          type: string
          description: First name and last initial of the Dasher delivering the order.
          example: John D.
        dasher_dropoff_phone_number:
          type: string
          description: Phone number for the Dasher; can only be called from dropoff_phone_number. Should include the country code.
          example: '+15555555555'
        dasher_pickup_phone_number:
          type: string
          description: Phone number for the Dasher; can only be called from pickup_phone_number. Should include the country code.
          example: '+14444444444'
        dasher_location:
          $ref: '#/components/schemas/Location_2'
        dasher_vehicle_make:
          type: string
          description: Make of the Dasher's vehicle.
          example: Toyota
        dasher_vehicle_model:
          type: string
          description: Model of the Dasher's vehicle.
          example: Corolla
        dasher_vehicle_year:
          type: string
          description: Year of the Dasher's vehicle.
          example: '2006'
    DeliveryOutput:
      title: DeliveryBase
      description: Delivery status and details provided by Doordash.
      type: object
      properties:
        delivery_status:
          type: string
          description: See the [delivery statuses](https://developer.doordash.com/en-US/docs/drive/reference/delivery_statuses) document for detailed descriptions of each status.
          enum:
          - quote
          - created
          - confirmed
          - enroute_to_pickup
          - arrived_at_pickup
          - picked_up
          - enroute_to_dropoff
          - arrived_at_dropoff
          - delivered
          - enroute_to_return
          - arrived_at_return
          - returned
          - cancelled
        cancellation_reason:
          type: string
          description: The reason why a delivery was cancelled.
          enum:
          - cancelled_by_creator
          - failed_to_process_payment
          - failed_to_assign_and_refunded
          - failed_to_pickup
          - failed_to_deliver
          - failed_to_return
        updated_at:
          type: string
          description: Time when the delivery info was updated in ISO-8601 format.
          example: '2018-08-22T17:20:28Z'
        pickup_time_estimated:
          type: string
          description: Estimated time of pickup in ISO-8601 format; null if already picked up.
          example: '2018-08-22T17:20:28Z'
        pickup_time_actual:
          type: string
          description: Actual time of pickup in ISO-8601 format; null if not yet picked up.
          example: '2018-08-22T17:20:28Z'
        dropoff_time_estimated:
          type: string
          description: Estimated time of drop off in ISO-8601 format; null if already picked up.
          example: '2018-08-22T17:20:28Z'
        dropoff_time_actual:
          type: string
          description: Actual time of drop off in ISO-8601 format; null if not yet picked up.
          example: '2018-08-22T17:20:28Z'
        dropoff_time_estimated_lower_bound:
          type: string
          description: Lower bound of the post-checkout estimated drop off time in ISO-8601 format.
          example: '2018-08-22T17:20:28Z'
        dropoff_time_estimated_upper_bound:
          type: string
          description: Upper bound of the post-checkout estimated drop off time in ISO-8601 format.
          example: '2018-08-22T17:35:28Z'
        dropoff_time_estimated_pre_checkout:
          type: string
          description: Estimated drop off time shown before an order is placed (pre-checkout), in ISO-8601 format. Populated only when enabled for the business/store.
          example: '2018-08-22T17:20:28Z'
        return_time_estimated:
          type: string
          description: Estimated time of return in ISO-8601 format; null if delivery is not returnable or already returned.
          example: '2018-08-22T17:20:28Z'
        return_time_actual:
          type: string
          description: Actual time of return in ISO-8601 format; null if return is not returnable or the return is not yet completed.
          example: '2018-08-22T17:20:28Z'
        return_address:
          $ref: '#/components/schemas/ReturnAddress'
        fee:
          type: integer
          format: int32
          example: 1900
          description: Delivery Fee in the lowest currency denomination (e.g. cents). i.e. $5.99 = 599 or null if not available.
          minimum: 0
        fee_components:
          type: array
          description: The charges that were applied for this delivery; sums to `fee`
          items:
            $ref: '#/components/schemas/FeeComponent'
        tax:
          type: integer
          format: int32
          example: 520
          description: Delivery tax in the lowest currency denomination (e.g. cents). i.e. $5.99 = 599 or null if not available.
          minimum: 0
        tax_components:
          type: array
          description: The taxes that were applied for this delivery; sums to `tax`. Only returned for deliveries in Canada.
          items:
            $ref: '#/components/schemas/TaxComponent'
        support_reference:
          $ref: '#/components/schemas/SupportReference'
        tracking_url:
          $ref: '#/components/schemas/TrackingUrl'
        dropoff_verification_image_url:
          $ref: '#/components/schemas/DropoffVerificationUrl'
        pickup_verification_image_url:
          $ref: '#/components/schemas/PickupVerificationUrl'
        dropoff_signature_image_url:
          $ref: '#/components/schemas/DropoffSignatureUrl'
        shipping_label:
          $ref: '#/components/schemas/ShippingLabel'
        dropped_items:
          type: array
          description: The items that were dropped because they were not available or suspended and not considered as per the catalog for DSS/DSD Orders.
          items:
            $ref: '#/components/schemas/DroppedItem'
    DangerousGoods:
      title: DangerousGoods
      type: object
      description: Hazardous materials (hazmat) information for an item shipped under applicable dangerous-goods regulations.
      required:
      - proper_shipping_name
      - commodity_level_code
      properties:
        proper_shipping_name:
          type: string
          description: Official proper shipping name of the hazardous material as defined by the applicable regulatory authority (DOT/IATA/IMDG).
          maxLength: 200
          example: ACETYL METHYL CARBINOL
        commodity_level_code:
          type: string
          description: Indicates the regulatory treatment level for this hazardous commodity.
          example: limited_quantity
          enum:
          - limited_quantity
        un_number:
          type: string
          description: Four-digit UN identification number assigned to the hazardous substance. Must be provided in the format "UN" followed by exactly four digits.
          pattern: ^UN\d{4}$
          example: UN2621
        class_number:
          type: string
          description: One of the nine HAZMAT shipping classes and sub classes
          example: '3'
        amount:
          type: number
          format: double
          description: Net quantity of hazardous material per package, expressed in the unit defined by `amount_measurement_type`.
          minimum: 0
          example: 10
        amount_measurement_type:
          type: string
          description: Unit of measure for the `amount` field.
          example: KGS
          enum:
          - KGS
          - LBS
          - L
          - ML
        packaging_group_type:
          type: string
          description: Packing group indicating the degree of danger of the substance. Group I = great danger, Group II = medium danger, Group III = minor danger. Not applicable to all hazard classes (e.g. explosives, gases).
          example: III
          enum:
          - I
          - II
          - III
        transportation_mode:
          type: string
          description: Mode of transport under which the dangerous goods declaration applies.
          example: ground
          enum:
          - ground
        quantity:
          type: integer
          format: int32
          description: Number of these items in the entire package.
          minimum: 1
          example: 1
    PaymentMethod:
      type: string
      description: The payment method to be used by the Dasher while shopping at the store. This is a required field for shop_deliver and shop_stage orders.
      enum:
      - red_card
      - barcode
      - shop_card
      - gift_cards
    DropoffOptions:
      type: object
      description: Additional options for drop off
      properties:
        signature:
          type: string
          description: Flag to specify if the delivery requires signature verification during drop off. Not updatable.
          enum:
          - required
          - preferred
          - none
        id_verification:
          type: string
          description: Flag to specify if ID verification is required at drop-off. If order contains alcohol, this field needs to be set to "required". Not updatable.
          enum:
          - required
          - preferred
          - none
        proof_of_delivery:
          type: string
          description: Flag to specify if the delivery requires proof of delivery during drop off. When "pin_code" is set as "proof_of_delivery", the "dropoff_pin_code_verification_metadata" must include relevant pin code data. Pin Code can be enabled only for orders that are non-contactless and not unattended deliveries. Please reach out to Doordash to enable this feature for your business. Not updatable. ("photo_preferred" is deprecated.)
          enum:
          - photo_required
          - photo_preferred
          - pin_code
          - none
        catering_setup:
          type: string
          description: Flag to specify if the delivery needs catering setup, only applicable to large order fulfillment delivery. Not updatable.
          enum:
          - required
          - none
    DropoffAddressName:
      type: string
      description: Optional name of the place, to help Dashers find the location.
      example: The Avery Condominium
    ExternalBusinessId:
      type: string
      pattern: /^[A-Za-z0-9_-]{3,64}$/
      description: The string identifier used to create your business. Used in combination with pickup_external_store_id to select the pick up location. If you provide an pickup_external_business_id, you must also provide an pickup_external_store_id.
      example: ase-243-dzs
    DeliveryOptions:
