openapi: 3.2.0
info:
  title: Doordash Delivery API
  x-refined-note:
  - x-logo differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Delivery across 2 of this provider''s published API definitions: doordash-drive-classic-openapi.yml, doordash-drive-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://openapi.doordash.com
  variables: {}
tags:
- name: Delivery
  x-displayName: Delivery
paths:
  /drive/v1/estimates:
    post:
      summary: Delivery Estimate
      tags:
      - Delivery
      description: Request time and fee estimates for the delivery. The Estimates API can also be used to check if an area is serviced.
      operationId: DeliveryEstimatePost
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              required:
              - dropoff_address
              - order_value
              type: object
              properties:
                pickup_address:
                  $ref: '#/components/schemas/PickupAddress'
                dropoff_address:
                  $ref: '#/components/schemas/DropoffAddress'
                order_value:
                  minimum: 0
                  type: integer
                  description: The subtotal for all items in the order, excluding tax/tip, in cents. i.e. $19.99 = 1999
                  format: int32
                  example: 1999
                delivery_time:
                  type: string
                  description: The requested UTC date-time (in ISO-8601 format) at which the order should be delivered. If this field is specified, `pickup_time` cannot be specified.Must provide either a `pickup_time` or a `delivery_time` to pass validation.
                  example: '2018-08-22T17:21:28Z'
                pickup_time:
                  type: string
                  description: The requested UTC date-time (in ISO-8601 format) at which the order should be picked up. If this field is specified, `delivery_time` cannot be specified. Must provide either a `pickup_time` or a `delivery_time` to pass validation.
                  example: '2018-08-22T17:20:28Z'
                external_business_name:
                  type: string
                  description: A name used to group stores under a particular owner. For example, John Smith's Franchise Business. Required if `pickup_address` object is not passed in. If `external_business_name` is used, `external_store_id` is required. Can't be used with `external_business_id`.
                  example: '1443432456'
                external_business_id:
                  type: string
                  pattern: /^[A-Za-z0-9_-]{3,64}$/
                  description: An unique, caller-selected ID of the business. Required if pickup_address object is not passed in. If `external_business_id` is used, `external_store_id` is required. Can't be used with `external_business_name`.
                  example: a0720d55-7cbe-41ce-8185-58285b7985cd
                external_store_id:
                  type: string
                  description: A unique identifier, defined by you, which can be used to track the specific store that the delivery is for. Required if `pickup_address` object is not passed in. If `external_store_id` is used, `external_business_name` is required.
                  example: mega-corp-2340593
                promotion_id:
                  type: string
                  description: The ID of the promotion that you want to apply to the delivery. The quoted fee in the response will reflect the promotion if this ID is valid. If the ID is invalid, field error will be returned. Contact your account manager for any configured promotion IDs.
                  example: ee680b87-0016-496e-ac3c-d3f33ab54c1c
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/ItemRequest'
        required: true
        description: Request body for estimate endpoint
      responses:
        '200':
          description: Estimate returned for the delivery with the given parameters
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryEstimate'
        '400':
          description: Bad request
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFieldErrorResponse'
        5XX:
          description: '- Please retry all 50x response status codes as the error could be transient. We recommend up to 3 retries with some exponential backoff delay between requests.

            - When providing a time to any of the below APIs (i.e. `pickup_time` or `delivery_time`), the format must be UTC.''

            '
      deprecated: false
    servers:
    - url: https://openapi.doordash.com
      variables: {}
  /drive/v1/validations:
    post:
      summary: Delivery Validation
      tags:
      - Delivery
      description: Validates input parameters for delivery and checks if the area is serviceable. DoorDash recommends using the Estimates API instead.
      operationId: DeliveryValidationPost
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              required:
              - dropoff_address
              - customer
              - order_value
              type: object
              properties:
                pickup_address:
                  $ref: '#/components/schemas/PickupAddress'
                pickup_phone_number:
                  type: string
                  description: The phone number for the Dasher to call, including country code, if there are any issues with the pick up. The phone number must be a valid phone number. Required unless your request includes an `external_store_id` that you've already used in at least one successful delivery request. If both `pickup_phone_number` and `external_store_id` are included, `pickup_phone_number` is ignored in favor of the existing phone number associated with the store.
                  example: '+15555555555'
                pickup_instructions:
                  type: string
                  description: Instruction for the dasher for the pickup location.
                  example: Use the back alley of the store for pickup
                dropoff_address:
                  $ref: '#/components/schemas/DropoffAddress'
                customer:
                  $ref: '#/components/schemas/Customer'
                dropoff_instructions:
                  type: string
                  description: Instruction for the dasher for the drop off location.
                  example: Use the access code 420 to get into the building.
                order_value:
                  minimum: 0
                  type: integer
                  description: The subtotal for all items in the order, excluding tax/tip, in cents. i.e. $19.99 = 1999
                  format: int32
                  example: 1999
                tip:
                  type: integer
                  description: The amount to tip the Dasher in cents i.e. $5.00 = 500
                  format: int32
                  example: 500
                pickup_time:
                  type: string
                  description: The requested UTC date-time (in ISO-8601 format) at which the order should be picked up. If this field is specified, `delivery_time` cannot be specified.
                  example: '2018-08-22T17:20:28Z'
                delivery_time:
                  type: string
                  description: The requested UTC date-time (in ISO-8601 format) at which the order should be delivered. If this field is specified, `pickup_time` cannot be specified.
                  example: '2018-08-22T17:21:28Z'
                external_delivery_id:
                  type: string
                  description: A unique identifier across all store locations under a business, defined by the merchant, which can be used to track this specific delivery.
                  example: 1342666-2420
                contains_alcohol:
                  type: boolean
                  description: Set this to true if the order contains alcohol. Default value is false.
                  example: true
                barcode_scanning_required:
                  type: boolean
                  description: Set this to true if barcode scanning at both pickup and dropoff is required to complete the delivery. Default value is false.
                  example: true
                num_items:
                  type: integer
                  description: The total number of items in the order.
                  format: int32
                  example: 1
                external_business_name:
                  type: string
                  description: A name used to group stores under a particular owner. For example, John Smith's Franchise Business. Required if `pickup_address` object is not passed in. If `external_business_name` is used, `external_store_id` is required. Can't be used with `external_business_id`.
                  example: '1443432456'
                external_business_id:
                  type: string
                  pattern: /^[A-Za-z0-9_-]{3,64}$/
                  description: An unique, caller-selected ID of the business. Required if pickup_address object is not passed in. If `external_business_id` is used, `external_store_id` is required. Can't be used with `external_business_name`.
                  example: a0720d55-7cbe-41ce-8185-58285b7985cd
                external_store_id:
                  type: string
                  description: A unique identifier, defined by you, which can be used to track the specific store that the delivery is for. Required if `pickup_address` object is not passed in. If `external_store_id` is used, `external_business_name` is required.
                  example: mega-corp-2340593
                signature_required:
                  type: boolean
                  description: Set this to true if signature is required. Default value is false.
                  example: true
                promotion_id:
                  type: string
                  description: The ID of the promotion that you want to apply to the delivery. If the ID is invalid, field error will be returned. Contact your account manager for any configured promotion IDs.
                  example: ee680b87-0016-496e-ac3c-d3f33ab54c1c
                order_contains_list:
                  type: array
                  description: An object that specifies the restricted item(s) contained in this order. The values that can be specified are 'tobacco_items' (delivery contains tobacco items, requires ID Verification), 'hemp_items' (delivery contains hemp items, requires ID Verification), 'otc_items' (delivery contains otc items, requires ID Verification)
                  enum:
                  - tobacco_items
                  - hemp_items
                  - otc_items
                  example:
                  - tobacco_items
                  - hemp_items
                  - otc_items
        required: true
      responses:
        '200':
          description: Validity of the delivery
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidDeliveryResponse'
        '400':
          description: Bad request
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFieldErrorResponse'
        5XX:
          description: '- Please retry all 50x response status codes as the error could be transient. We recommend up to 3 retries with some exponential backoff delay between requests.

            - When providing a time to any of the below APIs (i.e. `pickup_time` or `delivery_time`), the format must be UTC.''

            '
      deprecated: false
    servers:
    - url: https://openapi.doordash.com
      variables: {}
  /drive/v1/deliveries:
    post:
      summary: Delivery Creation
      tags:
      - Delivery
      description: Create a delivery
      operationId: DeliveryListPost
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              required:
              - dropoff_address
              - customer
              - order_value
              type: object
              properties:
                pickup_address:
                  $ref: '#/components/schemas/CreationPickupAddress'
                pickup_phone_number:
                  type: string
                  description: 'The phone number for the Dasher to call, including country code, if there are any issues with the pick up. The phone number must be a valid US phone number. This field is not required for existing stores with a known `external_store_id` '
                  example: '+16505555555'
                dropoff_address:
                  $ref: '#/components/schemas/DropoffAddress'
                customer:
                  $ref: '#/components/schemas/Customer'
                order_value:
                  minimum: 0
                  type: integer
                  description: The subtotal for all items in the order, excluding tax/tip, in cents. i.e. $19.99 = 1999
                  format: int32
                  example: 1999
                pickup_time:
                  type: string
                  description: The requested UTC date-time (in ISO-8601 format) at which the order should be picked up. If this field is specified, `delivery_time` cannot be specified.
                  example: '2018-08-22T17:20:28Z'
                delivery_time:
                  type: string
                  description: The requested UTC date-time (in ISO-8601 format) at which the order should be delivered. If this field is specified, `pickup_time` cannot be specified.
                  example: '2018-08-22T17:21:28Z'
                pickup_window_start_time:
                  type: string
                  description: The UTC date-time (in ISO-8601 format) overrides `delivery_time` and `pickup_time` when all four parameters of the delivery window (i.e. `pickup_window_start_time` , `pickup_window_end_time` , `delivery_window_start_time` , `delivery_window_end_time` ) are provided.
                  example: '2018-08-22T17:20:12Z'
                pickup_window_end_time:
                  type: string
                  description: The UTC date-time (in ISO-8601 format) overrides `delivery_time` and `pickup_time` when all four parameters of the delivery window (i.e. `pickup_window_start_time` , `pickup_window_end_time` , `delivery_window_start_time` , `delivery_window_end_time` ) are provided.
                  example: '2018-08-22T17:40:28Z'
                delivery_window_start_time:
                  type: string
                  description: The UTC date-time (in ISO-8601 format) overrides `delivery_time` and `pickup_time` when all four parameters of the delivery window (i.e. `pickup_window_start_time` , `pickup_window_end_time` , `delivery_window_start_time` , `delivery_window_end_time` ) are provided.
                  example: '2018-08-22T18:15:28Z'
                delivery_window_end_time:
                  type: string
                  description: The UTC date-time (in ISO-8601 format) overrides `delivery_time` and `pickup_time` when all four parameters of the delivery window (i.e. `pickup_window_start_time` , `pickup_window_end_time` , `delivery_window_start_time` , `delivery_window_end_time` ) are provided.
                  example: '2018-08-22T18:35:28Z'
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/ItemRequest'
                team_lift_required:
                  type: boolean
                  description: More than one dasher is required to complete the delivery
                  example: true
                barcode_scanning_required:
                  type: boolean
                  description: Barcode scanning at both pickup and dropoff is required to complete the delivery
                  example: false
                pickup_business_name:
                  type: string
                  description: The name of the business where the order should be picked up from.
                  example: Chipotle
                pickup_instructions:
                  type: string
                  description: Instructions for the Dasher to follow upon pickup of the order.
                  example: Enter gate code 1234 on the callbox.
                dropoff_instructions:
                  type: string
                  description: Instructions for the Dasher to follow upon delivery of the order.
                  example: Lock the front door after delivering the food.
                order_volume:
                  minimum: 0
                  type: integer
                  description: Only supported for specific use cases. Provide a list of `items` with `weight` and `volume` instead or contact support to discuss the use of `order_volume`.
                  format: int32
                  example: 5
                tip:
                  type: integer
                  description: The amount to tip the driver in cents i.e. $5.00 = 500
                  format: int32
                  example: 500
                external_delivery_id:
                  type: string
                  description: A unique identifier across all store locations under a business, defined by the merchant, which can be used to track this specific delivery.
                  example: 1342666-2420
                driver_reference_tag:
                  type: string
                  description: The internal order identifier at the merchant, which the driver can use to pick up the order. One example of a value for this field is the number the cashier hands the customer at a counter-serve restaurant.
                  example: '1'
                external_business_name:
                  type: string
                  description: A name used to group stores under a particular owner. For example, John Smith's Franchise Business. Required if `pickup_address` object is not passed in. If `external_business_name` is used, `external_store_id` is required. Can't be used with `external_business_id`.
                  example: '1443432456'
                external_business_id:
                  type: string
                  pattern: /^[A-Za-z0-9_-]{3,64}$/
                  description: An unique, caller-selected ID of the business. Required if pickup_address object is not passed in. If `external_business_id` is used, `external_store_id` is required. Can't be used with `external_business_name`.
                  example: a0720d55-7cbe-41ce-8185-58285b7985cd
                external_store_id:
                  type: string
                  description: A unique identifier, defined by you, which can be used to track the specific store that the delivery is for. Required if `pickup_address` object is not passed in. If `external_store_id` is used, `external_business_name` is required.
                  example: mega-corp-2340593
                contains_alcohol:
                  type: boolean
                  description: If true, flags the order as one that contains alcoholic beverages. This ensures that the driver will check the recipient's ID upon delivery.
                  example: false
                requires_catering_setup:
                  type: boolean
                  description: If true, flags the order as one that requires special setup at the consumer's location.
                  example: true
                num_items:
                  type: integer
                  description: The total number of items in the order.
                  format: int32
                  example: 1
                signature_required:
                  type: boolean
                  description: If true, flags the order as one that requires a signature from the consumer. Cannot be true if `allow_unattended_delivery` is true.
                  example: false
                allow_unattended_delivery:
                  type: boolean
                  description: If true, flags the order as one that does not require the customer to be present to receive the delivery. Cannot be true if `signature_required` is true and/or contains restricted items.
                  example: true
                cash_on_delivery:
                  type: integer
                  minimum: 0
                  description: Optional value in cents. Default is `None`. Cash orders must be contact not contactless orders and cash value must be greater than all fees. There maybe a limit up to a certain $ amount depending on Mx
                  example: 1000
                delivery_metadata:
                  type: object
                  description: A JSON document that allows adding metadata about the delivery such as item weight, size, etc.
                  example:
                    foo: bar
                allowed_vehicles:
                  type: array
                  description: An array of vehicles that are allowed to be used to complete this delivery. The only values that can be specified in the array are 'car', 'bicycle', or 'walker'.
                  enum:
                  - car
                  - bicycle
                  - walker
                  example:
                  - car
                  - bicycle
                is_contactless_delivery:
                  type: boolean
                  description: Allows for order to be dropped off without physically handing delivery to consumer
                  example: false
                promotion_id:
                  type: string
                  description: The ID of the promotion that you want to apply to the delivery. The fee in the response will reflect the promotion if this ID is valid. If the ID is invalid, field error will be returned. Contact your account manager for any configured promotion IDs.
                  example: ee680b87-0016-496e-ac3c-d3f33ab54c1c
                order_contains_list:
                  type: array
                  description: An object that specifies the restricted item(s) contained in this order. The values that can be specified are 'pharmacy_items' (delivery contains pharmacy items), 'age_restricted_pharmacy_items' (the order is an S3+ pharmacy order which requires ID Verification and can only be delivered to 18+ year olds), 'tobacco_items' (delivery contains tobacco items, requires ID Verification), 'hemp_items' (delivery contains hemp items, requires ID Verification), 'otc_items' (delivery contains otc items, requires ID Verification)
                  enum:
                  - pharmacy_items
                  - age_restricted_pharmacy_items
                  - tobacco_items
                  - hemp_items
                  - otc_items
                  example:
                  - pharmacy_items
                  - age_restricted_pharmacy_items
                  - tobacco_items
                  - hemp_items
                  - otc_items
                pin_code_verification_metadata:
                  type: object
                  description: An object that contains dropoff pin code verification metadata. Please reach out to Doordash to enable this feature for your business.
                  properties:
                    pin_code_type:
                      type: string
                      description: An enum that specifies the pin code value type. The values that can be specified are `customer_phone_number` (pin code for dropoff verification is the customer phone number's last 4 digits), `merchant_provided_number` (pin code for dropoff verification is the merchant provided 4 digit number), `random_number` (pin code for dropoff verification is the random 4 digit number generated by DD). Pin Code can be enabled only for orders that are non-contactless and not unattended deliveries
                      enum:
                      - customer_phone_number
                      - merchant_provided_number
                      - random_number
                      example: customer_phone_number
                    pin_code_value:
                      type: string
                      description: An object that contains pin code value, which should be a 4 digit number. This has to be sent only for the `merchant_provided_number` pin code type.
                      pattern: /^\d{4}$/
                      example: '1234'
        required: true
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
        '400':
          description: Bad request
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFieldErrorResponse'
        '409':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateDeliveryError'
        5XX:
          description: '- Please retry all 50x response status codes as the error could be transient. We recommend up to 3 retries with some exponential backoff delay between requests.

            - When providing a time to any of the below APIs (i.e. `pickup_time` or `delivery_time`), the format must be UTC.''

            '
      deprecated: false
    servers:
    - url: https://openapi.doordash.com
      variables: {}
  /drive/v1/deliveries/{delivery_id}:
    get:
      summary: Delivery Details
      tags:
      - Delivery
      description: Get details for a delivery
      operationId: DeliveryDetailGet
      parameters:
      - name: delivery_id
        in: path
        description: Id of the delivery that was created via the Create Delivery API call.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: extra
        in: query
        schema:
          type: string
          enum:
          - cash_on_delivery
        type: string
        description: Optional parameter requesting any cash on delivery details
      responses:
        '200':
          description: Delivery object by id
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
        '400':
          description: Bad request
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFieldErrorResponse'
        5XX:
          description: '- Please retry all 50x response status codes as the error could be transient. We recommend up to 3 retries with some exponential backoff delay between requests.

            - When providing a time to any of the below APIs (i.e. `pickup_time` or `delivery_time`), the format must be UTC.''

            '
      deprecated: false
    patch:
      summary: Update Delivery
      tags:
      - Delivery
      description: Update the time or address for a delivery
      operationId: DeliveryDetailPatch
      parameters:
      - name: delivery_id
        in: path
        description: Id of the delivery that was created via the Create Delivery API call.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pickup_business_name:
                  type: string
                  description: The name of the business where the order should be picked up from.
                  example: Chipotle
                pickup_instructions:
                  type: string
                  description: Instructions for the Dasher to follow upon pickup of the order.
                  example: Enter gate code 1234 on the callbox.
                pickup_phone_number:
                  type: string
                  description: The phone number for the Dasher to call, including country code, if there are any issues with the pick up. The phone number must be a valid US phone number.
                  example: '+15555555555'
                quoted_delivery_time:
                  type: string
                  description: The newly requested UTC date-time (in ISO-8601 format) at which the order should be delivered. If this field is specified, then `quoted_pickup_time` cannot be specified.
                  example: '2018-08-22T17:21:28Z'
                quoted_pickup_time:
                  type: string
                  description: The newly requested UTC date-time (in ISO-8601 format) at which the order should be picked up. If this field is specified, then `quoted_delivery_time` cannot be specified.
                  example: '2018-08-22T17:20:28Z'
                pickup_window_start_time:
                  type: string
                  description: The UTC date-time (in ISO-8601 format) overrides `delivery_time` and `pickup_time` when all four parameters of the delivery window (i.e. `pickup_window_start_time`, `pickup_window_end_time`, `delivery_window_start_time`, `delivery_window_end_time`) are provided.
                  example: '2018-08-22T17:20:28Z'
                pickup_window_end_time:
                  type: string
                  description: The UTC date-time (in ISO-8601 format) overrides `delivery_time` and `pickup_time` when all four parameters of the delivery window (i.e. `pickup_window_start_time`, `pickup_window_end_time`, `delivery_window_start_time`, `delivery_window_end_time`) are provided.
                  example: '2018-08-22T17:21:28Z'
                delivery_window_start_time:
                  type: string
                  description: The UTC date-time (in ISO-8601 format) overrides `delivery_time` and `pickup_time` when all four parameters of the delivery window (i.e. `pickup_window_start_time`, `pickup_window_end_time`, `delivery_window_start_time`, `delivery_window_end_time`) are provided.
                  example: '2018-08-22T17:22:28Z'
                delivery_window_end_time:
                  type: string
                  description: The UTC date-time (in ISO-8601 format) overrides `delivery_time` and `pickup_time` when all four parameters of the delivery window (i.e. `pickup_window_start_time`, `pickup_window_end_time`, `delivery_window_start_time`, `delivery_window_end_time`) are provided.
                  example: '2018-08-22T17:23:28Z'
                dropoff_address:
                  $ref: '#/components/schemas/DropoffAddress'
                first_name:
                  type: string
                  description: The customer's updated first name.
                  example: John
                last_name:
                  type: string
                  description: The customer's updated last name.
                  example: Smith
                business_name:
                  type: string
                  description: The customer's new business name.
                  example: Some Company Inc
                customer_phone_number:
                  type: string
                  description: The customer's new phone number including the country code.
                  example: '+15555555555'
                dropoff_special_instructions:
                  type: string
                  description: New instructions for the driver to follow upon delivery of the order.
                  example: Lock the front door after delivering the food.
                signature_required:
                  type: boolean
                  description: If true, flags the order as one that requires a signature from the consumer. Cannot be true if `allow_unattended_delivery` is true.
                  example: false
                allow_unattended_delivery:
                  type: boolean
                  description: If true, flags the order as one that does not require the customer to be present to receive the delivery. Cannot be true if `signature_required` is true and/or contain restricted items.
                  example: false
                contains_alcohol:
                  type: boolean
                  description: If true, flags the order as one that contains alcoholic beverages. This ensures that the driver will check the recipient's ID upon delivery.
                  example: false
                delivery_metadata:
                  type: object
                  description: A dictionary that allows adding metadata about the delivery such as item weight, size, etc.
                  example:
                    weight: foo
                    volume: bar
                    contains_batteries: true
                allowed_vehicles:
                  type: array
                  description: An array of vehicles that are allowed to be used to complete this delivery. The only values that can be specified in the array are 'car', 'bicycle', or 'walker'.
                  example:
                  - car
                  - bicycle
                  - walker
                tip:
                  type: integer
                  description: The tip (in cents) to be provided after the given delivery is completed.
                  format: int32
                  example: 1300
                order_ready_time:
                  type: string
                  description: The UTC time at which the order was actually ready at the pickup location.
                  example: '2018-08-22T17:20:28Z'
                order_contains_list:
                  type: array
                  description: An object that specifies the restricted item(s) contained in this order. The values that can be specified are 'tobacco_items' (delivery contains tobacco items, requires ID Verification), 'hemp_items' (delivery contains hemp items, requires ID Verification), 'otc_items' (delivery contains otc items, requires ID Verification)
                  enum:
                  - tobacco_items
                  - hemp_items
                  - otc_items
                  example:
                  - tobacco_items
                  - hemp_items
                  - otc_items
        required: true
