components:
  schemas:
    DropoffAddress:
      title: The address where the delivery needs to be dropped off.
      description: The address where the delivery needs to be dropped off.
      required:
      - city
      - state
      - street
      - zip_code
      type: object
      properties:
        city:
          type: string
          description: City for the address
          example: San Francisco
        state:
          type: string
          description: State for the address
          example: California
        street:
          type: string
          description: Street for the address
          example: 901 Market Street
        unit:
          type: string
          description: Suite, Apartment or Unit number of the address
          example: 'Suite #600'
        zip_code:
          type: string
          description: Zipcode for the address
          example: '94105'
        full_address:
          type: string
          description: Comma separated full address, in the order appropriate for your locale. Can be used as replacement for all other address component fields (unit, street, city, state, zip). Takes precedence over all other address component fields (unit, street, city, state, zip) if case of combined input.
          example: 901 Market Street 6th Floor, San Francisco, CA 94103
        location:
          title: The coordinates of dropoff address
          description: The Lat/Lng for dropoff address. This is an optional field that is being tested and is ignored unless indicated otherwise to you by the DoorDash team. If both location and text address are provided, we will use location for navigation and text address (and corresponding geocoded lat/lng) for all downstream calculations (fees, serviceability, etc.). Please contact us if interested in joining our pilot test group.
          required:
          - lat
          - lng
          type: object
          properties:
            lat:
              type: double
              description: Latitude for the address
              example: 37.78
            lng:
              type: double
              description: Longitude for the address
              example: -122.4
    Dasher:
      title: Dasher
      type: object
      description: The driver picking up the order from the store and dropping it off at the customer.
      required:
      - phone_number
      - id
      - first_name
      - last_name
      properties:
        id:
          type: int
          description: The unique identifier for the Dasher
          example: 1232142
        first_name:
          type: string
          description: The first name of the Dasher
          example: John
        last_name:
          type: string
          description: Last name of the Dasher
          example: Wick
        phone_number:
          type: string
          description: Masked phone number of the Dasher for the merchant to use. Number is masked for privacy and expires 30 minutes after the delivery is completed.
          example: +1-501-234-1343
        dasher_phone_number_for_customer:
          type: string
          description: Masked phone number of the Dasher for the customer to use. Number is masked for privacy and expires 30 minutes after the delivery is completed.
          example: +1-501-234-1343
        profile_image_url:
          type: string
          description: A URL to a photo of the Dasher
        vehicle:
          $ref: '#/components/schemas/Vehicle'
        location:
          $ref: '#/components/schemas/Location'
    PickupAddressResponse:
      title: The address the delivery needs to be picked up from.
      description: The address the delivery needs to be picked up from.
      required:
      - city
      - state
      - street
      - zip_code
      type: object
      properties:
        city:
          type: string
          description: City for the address
          example: San Francisco
        state:
          type: string
          description: State for the address
          example: California
        street:
          type: string
          description: Street for the address
          example: 101 Howard Street
        unit:
          type: string
          description: Suite, Apartment or Unit number of the address
          example: Apt 301
        zip_code:
          type: string
          description: Zipcode for the address
          example: '94105'
        dasher_parking_details:
          type: string
          description: An identifier describing where the dasher is parked, supplied by the dasher via the app. This value is null when the feature is not enabled.
          example: Parking Stall 1234
    ItemRequest:
      title: Item
      description: Items in the delivery
      required:
      - name
      type: object
      properties:
        name:
          type: string
          example: Mega Bean and Cheese Burrito
          description: Name of the item being delivered.
        description:
          type: string
          example: Mega Burrito contains the biggest beans of the land with extra cheese.
          description: Description of the item being delivered
        barcode:
          type: string
          example: '12342830041'
          description: 'Barcode identifying the item. This value must be in one of the following formats: Data Matrix, AZTEC, Code 128, Code 39, Code 93, CODABAR, EAN 13, EAN 8, ITF, UPC A, UPC E, PDF417'
        quantity:
          type: int
          example: 2
          description: Quantity of the item being delivered. Defaults to 1 if not provided.
        external_id:
          type: string
          example: 123-123443434b
          description: External name/id for the item as setup by the merchant.
        volume:
          type: double
          example: 5.3
          description: Unit volume of 1 instance of this item, in cubic feet, with or without a decimal point. The overall volume of this item is calculated by multiplying this field by `quantity`.
          exclusiveMaximum: 1000
        weight:
          type: double
          example: 2.8
          description: Unit weight of 1 instance of this item, in pounds (lbs), with or without a decimal point. The overall weight of this item is calculated by multiplying this field by `quantity`.
        length:
          minimum: 0
          type: double
          example: 2.8
          description: Unit length of 1 instance of this item, in inches, with or without a decimal point.
        width:
          minimum: 0
          type: double
          example: 2.8
          description: Unit width of 1 instance of this item, in inches, with or without a decimal point.
        height:
          minimum: 0
          type: double
          example: 2.8
          description: Unit height of 1 instance of this item, in inches, with or without a decimal point.
        price:
          type: int
          example: 1000
          description: Unit price of 1 instance of this item, in cents, i.e. 1000 = 10.00 in local currency. The overall price of this item is calculated by multiplying this field by `quantity`.
    ItemResponse:
      title: Item
      description: Items in the delivery
      required:
      - name
      type: object
      properties:
        name:
          type: string
          example: Mega Bean and Cheese Burrito
          description: Name of the item being delivered.
        description:
          type: string
          example: Mega Burrito contains the biggest beans of the land with extra cheese.
          description: Description of the item being delivered
        barcode:
          type: string
          example: '12342830041'
          description: 'Barcode identifying the item. This value must be in one of the following formats: Data Matrix, AZTEC, Code 128, Code 39, Code 93, CODABAR, EAN 13, EAN 8, ITF, UPC A, UPC E, PDF417'
        scan_status:
          type: string
          example: unknown
          description: 'Represents whether or not the dasher has scanned this item as a part of the delivery. Possible statuses:

            - "unknown" -> initial state, scanning not attempted yet

            - "scanned" -> this item was scanned in the Dasher app via the barcode scanner

            - "manually_scanned" -> currently not used, reserved for future use

            - "missing" -> this item was not scanned even though it was requested

            - "overage" -> this is an extra item that was not originally requested, but was scanned anyway

            '
        quantity:
          type: int
          example: 2
          description: Quantity of the item being delivered. Defaults to 1 if not provided.
        external_id:
          type: string
          example: 123-123443434b
          description: External name/id for the item as setup by the merchant.
        volume:
          type: int
          example: 5.3
          description: Unit volume of 1 instance of this item, in cubic feet, with or without a decimal point. The overall volume of this item is calculated by multiplying this field by `quantity`.
        weight:
          type: int
          example: 2.8
          description: Unit weight of 1 instance of this item, in pounds (lbs), with or without a decimal point. The overall weight of this item is calculated by multiplying this field by `quantity`.
        price:
          type: int
          example: 1000
          description: Unit price of 1 instance of this item, in cents, i.e. 1000 = 10.00 in local currency. The overall price of this item is calculated by multiplying this field by `quantity`.
    DeliveryCancelResponse:
      title: DeliveryCancelResponse
      type: object
      properties:
        return_initiated:
          type: boolean
        cancelled_at:
          type: string
    DeliveryValidationResponse:
      title: DeliveryValidationResponse
      type: object
      properties:
        valid:
          description: '`false` as the delivery request is invalid'
          type: boolean
          example: false
        errors:
          type: object
          x-nullable: true
          description: Field errors when the validation fails. `null` when the delivery is valid.
    DeliveryResponse:
      title: Delivery
      description: Object that describes the details of a delivery.
      required:
      - rating
      - pickup_window_start_time
      - actual_return_time
      - driver_reference_tag
      - contains_alcohol
      - updated_at
      - currency
      - estimated_pickup_time
      - pickup_window_end_time
      - order_volume
      - id
      - dasher_status
      - estimated_delivery_time
      - fee
      - quoted_pickup_time
      - dropoff_address
