          example: '2018-08-22T17:20:28Z'
        dropoff_contact_loyalty_number:
          type: string
          description: Loyalty number for the Customer to be applied at the checkout lane.
          example: 1234-5678-9876-5432-1
    SendNotifications:
      type: boolean
      description: Whether the contact will receive notifications from DoorDash for this delivery. The default is true.
      example: true
    DropoffPhoneNumber:
      title: Drop-off Phone number
      type: string
      description: The phone number for the Dasher to call if there are any issues with the delivery. Should include the country code. Must adhere to E.164 international phone number standard
      example: '+16505555555'
    CancelDeliveryInput:
