      type: object
    RecommendedDeliveryItem:
      title: RecommendedDeliveryItem
      description: Details about a recommended item to substitute for the original item.
      type: object
      required:
      - external_id
      properties:
        external_id:
          type: string
          description: Unique ID of the recommended item.
          pattern: /^.{1,100}$/
          example: 123443435
        name:
          type: string
          description: Name of the recommended item.
          pattern: /^.{1,100}$/
          example: Organic Banana
    DropoffEmailAddress:
      type: string
      description: Email address of the dropoff contact.
      example: john.doe@example.com
    DropoffPinCodeVerificationMetadata:
      title: DropoffPinCodeVerificationMetadata
      type: object
      description: An object that specifies the dropoff pin code verification related details for this order. When "pin_code" is set in "dropoff_options.proof_of_delivery", the object must include relevant pin code data. Conversely, if "pin_code" is not set as "proof_of_delivery", the object should exclude any pin code data. Pin Code can be enabled only for orders that are non-contactless and not unattended deliveries. Please reach out to Doordash to enable this feature for your business.
      properties:
        pin_code_type:
          $ref: '#/components/schemas/PinCodeType'
        pin_code_value:
          $ref: '#/components/schemas/PinCodeValue'
    CustomerExpectedSla:
      title: CustomerExpectedSla
      description: The expected delivery time or date shown to the customer.
      oneOf:
      - $ref: '#/components/schemas/Day'
      - $ref: '#/components/schemas/Time_Stamp'
    DropoffSignatureUrl:
      type: string
      description: Link to a picture of the dropoff contact's signature that was collected by the Dasher during drop off.
      example: https://doordash-static.s3...
    PinCodeValue:
      type: string
      pattern: /^\d{4}$/
      description: The string identifier that implies the pin code to use during dropoff or return verification. This value should be sent only when the PinCodeType is 'merchant_provided_number'.
      example: '1234'
    ShoppedItemsDetails:
      title: ShoppedItemsDetails
      description: Details about the individual items included in the order. If you want more info about shopped items, refer to the [DASHER_COMPLETED_SHOPPING webhook spec.](https://developer.doordash.com/en-US/docs/drive/how_to/Drive_DSX/how_to_shopping_complete_webhook)
      type: object
      properties:
        shopped_items:
          type: array
          description: The items shopped by the Dasher in the order. Once the Dasher has completed shopping, this will contain all of the scanned items.
          items:
            $ref: '#/components/schemas/ShoppedItem'
    PickupInstructions:
      type: string
      description: Instructions for the Dasher to follow when picking up the order.
      example: Go to the bar for pick up.
    DeliveryItemForSubsRecommendationRequest:
      title: DeliveryItemForSubsRecommendationRequest
      description: A shop item in the substitution recommendation request.
      type: object
      required:
      - external_id
      properties:
        external_id:
          type: string
          description: Unique ID generated by the caller for the item. This should be the identifier for the item in Catalog.
          pattern: /^.{1,100}$/
          example: 123443434
    PickupAddressComponents_US:
      type: object
      title: United States
      description: Pick-up Address broken down by components for US
      properties:
        street_address:
          type:
          - string
          - 'null'
          description: The street address of the pick-up location. If you have multiple lines, concatenate them with a comma
          example: 901 Market Street
        sub_premise:
          type:
          - string
          - 'null'
          description: Used to denote the unit number, suite number or apartment number
          example: Apt. 121
        city:
          type:
          - string
          - 'null'
          description: City for the address
          example: San Francisco
        state:
          type:
          - string
          - 'null'
          description: State for the address. 2 letter state codes for US addresses. For instance, “CA” for California
          example: CA
        zip_code:
          type:
          - string
          - 'null'
          description: Zip code for the address. 5 digit zip code for US addresses.
          example: 94103
        country:
          type:
          - string
          - 'null'
          description: Country needs to be passed as an ISO 3166 Alpha 2 code. “US” for United States of America. “PR” for Puerto Rico
          example: US
    PickupVerificationUrl:
      type: string
      description: Link to the picture taken by the Dasher to indicate where the order was picked up.
      example: https://doordash-static.s3...
    ActionIfUndeliverable:
      type: string
      description: What the Dasher should do if the delivery is undeliverable. If left blank, the order will be treated as contactless. See [Create return to pickup deliveries](https://developer.doordash.com/en-US/docs/drive/how_to/return_to_pickup/) for more information.
      enum:
      - return_to_pickup
      - dispose
    SubstitutionRecommendationInput:
      title: SubstitutionRecommendationInput
      description: Request body for get substitution recommendation endpoint
      allOf:
      - $ref: '#/components/schemas/delivery_SubstitutionRecommendationInput'
      type: object
    CreateDeliveryInput:
      title: CreateDeliveryInput
      allOf:
      - $ref: '#/components/schemas/DeliveryEmptyBase'
      - $ref: '#/components/schemas/DeliveryBase'
      - $ref: '#/components/schemas/DeliveryPickupDetails'
      - $ref: '#/components/schemas/DeliveryDropoffDetails'
      - $ref: '#/components/schemas/DeliveryShoppingOptions'
      - $ref: '#/components/schemas/DeliveryValueInputDetails'
      - $ref: '#/components/schemas/DeliveryItemsDetails'
      - $ref: '#/components/schemas/DeliveryInputOnlyOptions'
      - $ref: '#/components/schemas/DeliveryOptions'
