          example: false
        tip:
          type: integer
          description: The amount to tip the Dasher in cents i.e. $5.00 = 500
          format: int32
          example: 500
        team_lift_required:
          type: boolean
          description: More than one dasher is required to complete the delivery
          example: true
        external_store_id:
          type: string
          description: A unique identifier, defined by you, which can be used to track the specific store that the delivery is for.
          example: '148767394'
        pickup_instructions:
          type: string
          description: Instruction for the dasher for the pickup location.
          example: Use the back alley of the store for pickup
        dasher:
          $ref: '#/components/schemas/Dasher'
        status:
          type: string
          description: The status of the delivery
          enum:
          - scheduled
          - assigned
          - picked_up
          - delivered
          - cancelled
          - pending_return
          - returned
        quoted_delivery_time:
          type: string
          description: Estimated time by which the order will be delivered.
          example: '2018-08-22T18:35:28Z'
        actual_pickup_time:
          type: string
          description: Actual time at which the delivery was picked up by the dasher.
          example: '2018-08-22T18:35:28Z'
        signature_required:
          type: boolean
          description: If true, flags the order as one that requires a signature from the consumer. Cannot be true if `allow_unattended_delivery` is true.
          example: false
        pickup_address:
          $ref: '#/components/schemas/PickupAddressResponse'
        barcode_scanning_required:
          type: boolean
          description: Barcode scanning at both pickup and dropoff is required to complete the delivery
          example: false
        delivery_tracking_url:
          type: string
          description: 'Tracking page for the delivery that you can use or share with the sender and/or receiver of the delivery. Note: the URL format is not fixed and may change over time.'
          example: http://drd.sh/d035NtWrk/
        external_delivery_id:
          type: string
          description: A unique identifier across all store locations under a business, defined by the merchant, which can be used to track this specific delivery.
          example: 1342666-2420
        customer:
          $ref: '#/components/schemas/Customer'
        order_value:
          type: integer
          format: int64
          description: Total value of the order being delivered in cents e.g. 14000 is $140
          example: 14000
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemResponse'
          description: An array of items provided by the merchant at the time of delivery creation
        dropoff_instructions:
          type: string
          description: Instructions for dasher at the time of delivery drop off
          example: Please call me to buzz you in
        actual_delivery_time:
          type: string
        signature_image_url:
          type: string
          description: The link to an image of the signature supplied by the customer if they were required to sign for the delivery. This link will expire in 3 days.
          example: https://doordash-static.s3-us-west-2.amazonaws.com/media/drive/drive-logo.png
        quantity:
          description: Quantity of the item being delivered.
          type: integer
          format: int64
          example: 1
        delivery_verification_image_url:
          type: string
          description: A URL for the delivery verification image uploaded by the Dasher; only available if the delivery required a verification image to be taken at delivery.
          example: https://doordash-static.s3-us-west-2.amazonaws.com/media/drive/drive-logo.png
        pickup_verification_image_url:
          type: string
          description: A URL for the pickup verification image uploaded by the Dasher; only available if the delivery required a verification image to be taken at pickup.
          example: https://doordash-static.s3-us-west-2.amazonaws.com/media/drive/drive-logo.png
        relationship_type:
          type: string
          description: For deliveries where `signature_required` is `true`, how the person who signed for the delivery is related to the delivery recipient.
          enum:
          - Self
          - Wife
          - Husband
          - Mother
          - Father
          - Daughter
          - Son
          - Front desk
          - Nurse
          - Caregiver
          - Other
          example: Self
        relationship_description:
          type: string
          description: For deliveries where `signature_required` is `true` and `relationship_type` is `other`, a description of how the person who signed for the delivery is related to the delivery recipient.
          example: Brother
        order_contains_list:
          type: array
          description: An object that specifies the restricted item(s) contained in this order. The values that can be specified are 'pharmacy_items' (delivery contains pharmacy items), 'age_restricted_pharmacy_items' (the order is an S3+ pharmacy order which requires ID Verification and can only be delivered to 18+ year olds), 'tobacco_items' (delivery contains tobacco items, requires ID Verification), 'hemp_items' (delivery contains hemp items, requires ID Verification), 'otc_items' (delivery contains otc items, requires ID Verification)
          enum:
          - pharmacy_items
          - age_restricted_pharmacy_items
          - tobacco_items
          - hemp_items
          - otc_items
          example:
          - pharmacy_items
          - age_restricted_pharmacy_items
          - tobacco_items
          - hemp_items
          - otc_items
        pin_code_verification_metadata:
          type: object
          description: An object that contains dropoff pin code verification metadata. Please reach out to Doordash to enable this feature for your business.
          properties:
            pin_code_type:
              type: string
              description: An enum that specifies the pin code value type. The values that can be specified are `customer_phone_number` (pin code for dropoff verification is the customer phone number's last 4 digits), `merchant_provided_number` (pin code for dropoff verification is the merchant provided 4 digit number), `random_number` (pin code for dropoff verification is the random 4 digit number generated by DD). Pin Code can be enabled only for orders that are non-contactless and not unattended deliveries
              enum:
              - customer_phone_number
              - merchant_provided_number
              - random_number
              example: customer_phone_number
            pin_code_value:
              type: string
              description: An object that contains pin code value, which should be a 4 digit number. This must be sent only for `merchant_provided_number` pin code type.
              pattern: /^\d{4}$/
              example: '1234'
