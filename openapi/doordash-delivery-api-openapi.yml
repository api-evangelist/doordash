      type: string
      description: 'Tracking page for the delivery that you can use or share with the sender and/or receiver of the delivery. Note: the URL format is not fixed and may change over time.'
      example: https://doordash.com/tracking?id=
    ScannedData:
      title: ScannedData
      description: Data class representing the scanned barcode data.
      type: object
      required:
      - format
      properties:
        format:
          type: string
          description: Format of the barcode. Enum ["upc-a","upc-e","ean-13","ean-8","plu","gtin-14","unknown"]
          example: upc-a
        is_variable_measure:
          type: boolean
          description: Indicates whether the barcode represents a variable measure product with price or weight.
          example: false
        indicator_digit:
          type: string
          description: The indicator digit, used in Gtin14 barcodes to classify the type of item
          example: 1
        product_code:
          type: string
          description: Identifies an item within a given system, used in most barcode formats.
          example: 200
        check_digit:
          type: string
          description: Used to verify the integrity of the barcode data, used in most barcode formats.
          example: 1
        country_code:
          type: string
          description: Identifies the country where the manufacturer is registered, used in EAN-13 and EAN-8 barcodes.
          example: 4
        manufacturer_code:
          type: string
          description: The manufacturer code assigned to the company that produced the product, used in UPC-A, EAN-13, UPC-E.
          example: 41303
        number_system:
          type: string
          description: Helps determine the type of barcode and its categorization, used in UPC-A, UPC-E.
          example: 0
        plu_check_digit:
          type: string
          description: Price check digit used in variable measure barcodes.
          example: 5
        company_prefix:
          type: string
          description: Company prefix is part of Gtin14 barcode, identifying the brand owner or manufacturer.
          example: 12345
        item_reference:
          type: string
          description: Identifies a product within a company’s system, used in Gtin14 barcodes.
          example: 67890
        scanned_code_sans_check_digit:
          type: string
          description: The scanned barcode excluding the check digit.
          example: 4130300200
    ShoppingOptions:
      title: ShoppingOptions
