          example: limited_quantity
          enum:
          - limited_quantity
    OriginFacilityId:
      type: string
      description: Merchant warehouse id for the midmile
      example: MERCHANTA-CA-1
    ServiceabilityCheckResponse:
      title: ServiceabilityCheckResponse
      description: Response containing serviceability check results
      type: object
      properties:
        is_serviceable:
          type: boolean
          description: Whether the delivery route is serviceable by DoorDash
        reasons_not_serviceable:
          type: array
          items:
            type: string
          description: Reasons why the delivery is not serviceable (if applicable)
      required:
      - is_serviceable
    PickupPhoneNumber:
      title: Pickup Phone number
      type: string
      description: The phone number for the Dasher to call if there are any issues with the pick up. Should include the country code and must match the country of the store for which the delivery is created. Overridden by store properties if pickup_external_store_id and pickup_external_business_id are used. Must adhere to E.164 international phone number standard.
      example: '+16505555555'
    ExternalDeliveryId:
      type: string
      pattern: /[a-zA-Z0-9-._~]+/
      description: Unique ID generated by the caller for the delivery.
      example: D-1763
    DeliveryItem:
      title: DeliveryItem
      description: Details about an individual item in the order.
      type: object
      explode: false
      required:
      - name
      - quantity
      properties:
        name:
          type: string
          description: Name of the item being delivered.
          pattern: /^.{1,100}$/
          example: Mega Bean and Cheese Burrito
        description:
          type: string
          description: Description of the item being delivered.
          pattern: /^.{1,500}$/
          example: Mega Burrito contains the biggest beans of the land with extra cheese.
        quantity:
          type: integer
          format: int32
          description: Quantity of the item being delivered.
          minimum: 1
          maximum: 100
          example: 2
        external_id:
          type: string
          description: Unique ID generated by the caller for the item.
          pattern: /^.{1,100}$/
          example: 123-123443434b
        external_instance_id:
          type: string
          description: used to distinguish between multiple items with the same external_id, such as for 2 steaks in the same order with separate weights. Not updatable.
          example: 12
        volume:
          type: number
          format: double
          minimum: 0
          maximum: 999.9995
          description: Unit volume of 1 instance of this item, in cubic feet, with or without a decimal point. The overall volume of this item is calculated by multiplying this field by quantity.
          example: 5.3
        weight:
          type: number
          format: double
          minimum: 0
          maximum: 999.9995
          description: Unit weight of 1 instance of this item, in pounds (lbs), with or without a decimal point. The overall weight of this item is calculated by multiplying this field by quantity.
          example: 2.8
        length:
          type: number
          format: double
          minimum: 0
          description: Unit length of 1 instance of this item, in inches, with or without a decimal point.
          example: 2.8
        width:
          type: number
          format: double
          minimum: 0
          description: Unit weight of 1 instance of this item, in inches, with or without a decimal point.
          example: 2.8
        height:
          type: number
          format: double
          minimum: 0
          description: Unit weight of 1 instance of this item, in inches, with or without a decimal point.
          example: 2.8
        price:
          type: integer
          format: int32
          minimum: 0
          maximum: 9999999
