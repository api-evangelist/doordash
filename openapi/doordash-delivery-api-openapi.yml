          description: 'The cash to collect when this order is dropped off, value in the lowest currency denomination (e.g. cents). i.e. $19.99 = 1999. [Pre-release field: [Submit a ticket](https://developer.doordash.com/portal/support) or reach out to your DoorDash contact if you would like to accept cash on delivery.]'
          format: int32
          example: 1999
        order_route_type:
          $ref: '#/components/schemas/OrderRouteType'
        order_route_items:
          $ref: '#/components/schemas/OrderRouteItems'
    Time:
      title: TimeDetails
      description: Time details in ISO-8601 format.
      type: string
      example: '2018-08-22T17:20:28Z'
    DeliveryBase:
      title: DeliveryBase
      description: Delivery status and details.
      required:
      - external_delivery_id
      type: object
      properties:
        external_delivery_id:
          $ref: '#/components/schemas/ExternalDeliveryId'
        locale:
          $ref: '#/components/schemas/Locale'
        order_fulfillment_method:
          $ref: '#/components/schemas/OrderFulfillmentMethod'
        origin_facility_id:
          $ref: '#/components/schemas/OriginFacilityId'
    ItemOptions:
      title: DeliveryItemOptions
      description: Details about how to shop for an item. Not updatable.
      type: object
      required:
      - substitution_preference
      - weight_unit
      properties:
        substitute_item_ids:
          description: External IDs for items to be substituted if the original item is out of stock. Not updatable.
          type: array
          items:
            SubstituteItemIDs:
              type: string
          example:
          - '123443434'
          - '123443435'
        merchant_recommended_substitute_item_ids:
          description: Merchant provided external IDs for items to be substituted if the original item is out of stock. Cannot be used simultaneously with substitute_item_ids. Not updatable.
          type: array
          items:
            SubstituteItemIDs:
              type: string
          example:
          - '543443434'
          - '543443435'
        substitute_item_ids_additional_metadata:
          description: Additional metadata for the provided substitute items. The metadata id should match an id from substitute_item_ids or merchant_recommended_substitute_item_ids. Not updatable.
          type: array
          items:
            $ref: '#/components/schemas/SubstituteItemMetadata'
          example:
          - id: '123443434'
            quantity: 1
            weight: 2.5
            weight_unit: lbs
          - id: '123443435'
            quantity: 2
        weight_unit:
          type: string
          description: The weight unit for the item being shopped. Not updatable.
          enum:
          - oz
          - lbs
          - kg
        substitution_preference:
          type: string
          description: Substitution preference to apply when an item is out of stock. Not updatable.
          enum:
          - refund
          - contact
          - substitute
    Contactless:
