          example: '2018-08-22T17:20:12Z'
        pickup_window_end_time:
          type: string
          description: The UTC date-time (in ISO-8601 format) overrides `delivery_time` and `pickup_time` when all four parameters of the delivery window (i.e. `pickup_window_start_time` , `pickup_window_end_time` , `delivery_window_start_time` , `delivery_window_end_time` ) are provided.
          example: '2018-08-22T17:40:28Z'
        delivery_window_start_time:
          type: string
          description: The UTC date-time (in ISO-8601 format) overrides `delivery_time` and `pickup_time` when all four parameters of the delivery window (i.e. `pickup_window_start_time` , `pickup_window_end_time` , `delivery_window_start_time` , `delivery_window_end_time` ) are provided.
          example: '2018-08-22T18:15:28Z'
        delivery_window_end_time:
          type: string
          description: The UTC date-time (in ISO-8601 format) overrides `delivery_time` and `pickup_time` when all four parameters of the delivery window (i.e. `pickup_window_start_time` , `pickup_window_end_time` , `delivery_window_start_time` , `delivery_window_end_time` ) are provided.
          example: '2018-08-22T18:35:28Z'
        actual_return_time:
          type: string
          description: The time at which the delivery was actually returned.
          example: '2018-08-22T18:35:28Z'
        driver_reference_tag:
          type: string
          description: The internal order identifier at the merchant, which the driver can use to pick up the order. One example of a value for this field is the number the cashier hands the customer at a counter-serve restaurant.
          example: ABD13234
        contains_alcohol:
          type: boolean
          description: Set this to true if the order contains alcohol. Default value is false.
          example: true
        updated_at:
          type: string
          description: The timestamp at which the delivery got updated.
          example: '2018-08-22T18:35:28Z'
        currency:
          type: string
          description: Currency for the delivery fees
          example: USD
        estimated_pickup_time:
          type: string
          description: An estimate of the time by which the dasher will pickup the order from the pickup location provided at the time of delivery creation.
          example: '2018-08-22T18:35:28Z'
        order_volume:
          type: integer
          format: int64
          description: Only supported for specific use cases. Provide a list of `items` with `weight` and `volume` instead or contact support to discuss the use of `order_volume`.
          example: 3
        id:
          type: integer
          format: int64
          description: The id of the delivery
        dasher_status:
          type: string
          description: The status of the dasher
          enum:
          - unassigned
          - accepted
          - arrived_at_store
          - picked_up
          - arrived_at_consumer
          - dropped_off
          - pending_return
          - dropped_off_return
        estimated_delivery_time:
          type: string
          description: An estimate of the time by which, the dasher will drop off the order at the customer's location provided at the time of delivery creation.
          example: '2018-08-22T18:35:28Z'
        fee:
          type: integer
          format: int64
          example: 1900
          description: Delivery Fees in cents. i.e. 1940 equals $19.40
          minimum: 0
          x-nullable: false
        fee_components:
          type: array
          description: The charges that were applied for this delivery; sums to `fee`.
          items:
            $ref: '#/components/schemas/FeeComponent'
        tax:
          type: integer
          format: int32
          example: 520
          description: Delivery tax in the lowest currency denomination (e.g. cents). i.e. $5.99 = 599 or null if not available.
          minimum: 0
        tax_components:
          type: array
          description: The taxes that were applied for this delivery; sums to `tax`. Only returned for deliveries in Canada.
          items:
            $ref: '#/components/schemas/TaxComponent'
        quoted_pickup_time:
          type: string
