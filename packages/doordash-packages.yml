provider: doordash
description: >-
  DoorDash publishes one first-party API client library — the Node.js Drive SDK on npm — plus a
  first-party fork of oapi-codegen it uses to generate Go clients from OpenAPI. Every other
  DoorDash-named package found on npm, PyPI, Packagist and RubyGems is third-party. The registry
  metadata is the abandonment signal worth reading here: the only client SDK DoorDash ships last
  published in October 2024, while the Drive API it wraps has continued to add endpoints
  (serviceability, items_substitution_recommendation) that the SDK does not cover.
